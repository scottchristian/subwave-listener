version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Sydney
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      # Routine patch/minor bumps arrive as one PR. Majors stay separate: a
      # next, react or prisma major is a migration, not a bump.
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # Dockerfile.e2e is the throwaway station the updater test builds from.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Sydney
    commit-message:
      prefix: chore(docker)

  # No workflows exist yet, but this entry means actions are covered as soon
  # as one is added.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Sydney
    commit-message:
      prefix: chore(ci)
