# Panel, touch, and LVGL.
#
# The panel block itself lives in panel.yaml (or whatever `panel_include`
# names) so that it can be swapped without touching anything below.
#
# THE PANEL IS 800x1280 PORTRAIT. The UI is 1280x800 landscape, driven by a
# rotation rather than by the panel being landscape. Getting that backwards
# produces a screen that is alive, responsive, and mirrored — so it is worth
# knowing before you spend an afternoon on it.
display: !include ${panel_include}

touchscreen:
  - platform: gsl3680
    id: tft_touch
    display: tft_display
    reset_pin: GPIO22
    interrupt_pin: GPIO21
    transform:
      mirror_x: true
      # VERIFIED IN PHASE 2 BEFORE ANYTHING ELSE. A wrong touch transform makes
      # every later step unverifiable: you cannot tell a layout bug from a
      # coordinate bug, and both look like "the button does nothing".
      mirror_y: false
    # THE ONLY TOUCH LISTENER ON THE DEVICE, and it exists for one reason:
    # waking. "Waking is touch-only" (device/design.md) because there is no audio
    # here and so no user activity to measure — a track change or a heartbeat
    # must not light up a screen in an empty room.
    #
    # It was missing entirely until 1.9.0, which is why the screen could not
    # wake even once the dimming existed. Every other interaction — Skip, the
    # brightness segments, the carousel arrows, the setup screen — is wired to
    # its own widget, so this is the only path that fires when nothing is
    # pressed-and-held on a control, and it has to exist for the screen to come
    # back at all.
    on_touch:
      - script.execute: idle_arm

# WiFi is a SEPARATE ESP32-C6 on SPI, so the display and the network are
# coupled only by the fact that they share a board.
#
# NO SEPARATE `spi:` BLOCK. An earlier version of this file declared one with
# clk/mosi/miso AND passed `spi_id:` here — which double-declared GPIO16 and
# GPIO17 as both SPI data and the C6's d2/d3, and `spi_id` is not an option this
# component accepts at all. The pins are declared once, here, exactly as the
# reference board config for this panel does it.
esp32_hosted:
  variant: esp32c6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true

lvgl:
  id: main_lvgl
  # 6% is the reference project's value for this panel and it is deliberate.
  buffer_size: 6%
  # The P4 software rotation path uses PPA/DMA, so rotated draw chunks want a
  # cache-line-friendly RGB565 boundary rather than LVGL's 2-pixel default.
  # Do not change this without measuring.
  draw_rounding: 32
  byte_order: little_endian
  rotation: ${display_rotation}

  # The reference project has this on_boot sequence to initialize LVGL properly.
  # Without it, the display may not initialize properly and remain blank.
  on_boot:
    - lambda: |
        id(lvgl_ready) = true;
    - script.execute: apply_screen_rotation

  pages:
    - id: main_page
      scrollbar_mode: "off"
      scrollable: false
      width: 100%
      height: 100%
      bg_color: 0x000000
      pad_top: 0
      pad_bottom: 0
      pad_left: 0
      pad_right: 0

      widgets:
        # ---------------------------------------------------------------------------
        # WHAT WAS HERE, AND WHY IT IS GONE.
        #
        # Fourteen widgets inherited from the reference board's config: an artwork
        # backdrop, two cover images, an "artwork unavailable" label, a 480px
        # opaque black accent panel, a track-info panel with its own title / artist
        # / time labels, a play/pause button, a progress bar and a station logo.
        #
        # NOT ONE OF THEM WAS BOUND OR REFERENCED. Each screen carries its own
        # artwork, its own title and its own logo, and every one of these ids
        # appears in no bind_object() call and in no OBJ() in the C++. They were
        # also, unavoidably, invisible: they are siblings of window_stack rather
        # than children of it, and window_stack is declared after them, so all
        # three windows — each with an opaque background — were painted over the
        # lot.
        #
        # They stayed anyway, and that is the problem. The accent panel is 480px of
        # solid black on the RIGHT-HAND side of the screen, which is exactly where
        # now.yaml puts the cover — so to anyone reading this file it looks
        # deliberately placed to hide the artwork. And the play/pause button was
        # wired to skip_toggle, which toggles a SETTING, so a reader would
        # reasonably conclude there was a working media control wired to the wrong
        # thing.
        #
        # Inert code sitting in the wrong place is still wrong, and worse than
        # missing code: the next person to move an artwork x-coordinate spends an
        # afternoon on a panel that was never on screen.
        # ---------------------------------------------------------------------------

        # ---- the sliding stack (three windows + setup + sleep hint) ----
        - obj:
            id: window_stack
            width: 100%
            height: 100%
            align: TOP_LEFT
            scrollable: false
            widgets:
              # 1 of 3 — what is playing.
              - obj:
                  id: window_0
                  width: 100%
                  height: 100%
                  align: TOP_LEFT
                  scrollable: false
                  bg_color: 0x06101E
                  bg_opa: COVER
                  widgets: !include screens/now.yaml

              # 2 of 3 — the show list.
              - obj:
                  id: window_1
                  width: 100%
                  height: 100%
                  align: TOP_LEFT
                  scrollable: false
                  bg_color: 0x06101E
                  bg_opa: COVER
                  widgets: !include screens/shows.yaml

              # 3 of 3 — the screen's own settings.
              - obj:
                  id: window_2
                  width: 100%
                  height: 100%
                  align: TOP_LEFT
                  scrollable: false
                  bg_color: 0x06101E
                  bg_opa: COVER
                  widgets: !include screens/settings.yaml

              # The provisioning screens. Two slots in the same stack: Wi-Fi,
              # then bind-to-station. Navigated with window_go (targets 3, 4).
              - obj:
                  id: setup_wifi_screen
                  width: 100%
                  height: 100%
                  align: TOP_LEFT
                  scrollable: false
                  bg_color: 0x06101E
                  bg_opa: COVER
                  widgets: !include screens/setup_wifi.yaml

              - obj:
                  id: setup_bind_screen
                  width: 100%
                  height: 100%
                  align: TOP_LEFT
                  scrollable: false
                  bg_color: 0x06101E
                  bg_opa: COVER
                  widgets: !include screens/setup_bind.yaml

              # The asleep notice — the last slot, bare label.
              - label:
                  id: sleep_hint
                  width: 100%
                  height: 100%
                  align: TOP_LEFT
                  text_color: 0x6A8BA8
                  text_font: font_body
                  text_align: CENTER
                  hidden: true

        # ---- chrome: arrows and rail, outside every window ----
        - obj:
            id: chrome
            width: 100%
            height: 72px
            align: BOTTOM_LEFT
            scrollable: false
            bg_color: 0x06101E
            bg_opa: COVER
            widgets:
              - button:
                  id: btn_prev
                  width: 88px
                  height: 72px
                  align: LEFT_MID
                  bg_color: 0x06101E
                  bg_opa: COVER
                  border_width: 0
                  radius: 0
                  on_click:
                    - script.execute: window_prev
              - label:
                  id: glyph_prev
                  text: "‹"
                  text_font: font_title
                  text_color: 0x6A8BA8
                  align: CENTER

              # Four segments. Filled means "you are here".
              - obj:
                  id: rail
                  width: 96px
                  height: 4px
                  align: CENTER
                  bg_color: 0x1A3050
                  bg_opa: COVER
                  radius: 2px
                  widgets:
                    - obj:
                        id: rail_0
                        align: LEFT_MID
                        x: 0px
                        width: 22px
                        height: 4px
                        bg_color: 0x4E9FD4
                        bg_opa: COVER
                        radius: 2px
                    - obj:
                        id: rail_1
                        align: LEFT_MID
                        x: 26px
                        width: 22px
                        height: 4px
                        bg_color: 0x1A3050
                        bg_opa: COVER
                        radius: 2px
                    - obj:
                        id: rail_2
                        align: LEFT_MID
                        x: 52px
                        width: 22px
                        height: 4px
                        bg_color: 0x1A3050
                        bg_opa: COVER
                        radius: 2px
                    - obj:
                        id: rail_3
                        align: LEFT_MID
                        x: 78px
                        width: 22px
                        height: 4px
                        bg_color: 0x1A3050
                        bg_opa: COVER
                        radius: 2px

              - button:
                  id: btn_next
                  width: 88px
                  height: 72px
                  align: RIGHT_MID
                  bg_color: 0x06101E
                  bg_opa: COVER
                  border_width: 0
                  radius: 0
                  on_click:
                    - script.execute: window_next
              - label:
                  id: glyph_next
                  text: "›"
                  text_font: font_title
                  text_color: 0x6A8BA8
                  align: CENTER

# ---------------------------------------------------------------------------
# Artwork.
#
# `online_image` rather than a baked-in `image:`, because the cover changes every
# few minutes and a wall screen cannot be reflashed each time. It also ships
# `online_image.set_url` and `online_image.release`, which is what theme.yaml's
# art_swap needs to hold the outgoing cover until the incoming one has actually
# decoded.
#
# RGB565, BINARY, resized at decode. The panel is RGB565 and resizing on the
# device rather than asking the station for a 520px cover keeps the download
# buffer small — which on hex-mode PSRAM is not a detail.
#
# THE INITIAL URL IS DELIBERATELY A 404. There is no artwork until the station
# says what is playing, and pointing these at a placeholder file that does not
# exist gets the same result — an empty surface — without shipping a placeholder
# and without pretending the screen has a cover it does not.
# ---------------------------------------------------------------------------
online_image:
  - id: art_out_image
    http_request_id: shared_http
    url: "http://192.168.4.1/api/devices/art/none.jpg"
    format: JPEG
    type: BINARY
    resize: 520x520
    buffer_size: ${art_buffer_bytes}
    update_interval: never
    # The art route is bearer-protected; without this every fetch 401s and the
    # cover stays blank. The header is templated so it is read at fetch time,
    # after the claim has stored the token.
    request_headers:
      Authorization: !lambda "return std::string(\"Bearer \") + id(display_client)->bearer();"
    on_error:
      - logger.log: "art_out: nothing to show yet"

  - id: art_in_image
    http_request_id: shared_http
    url: "http://192.168.4.1/api/devices/art/none.jpg"
    format: JPEG
    type: BINARY
    resize: 520x520
    buffer_size: ${art_buffer_bytes}
    update_interval: never
    request_headers:
      Authorization: !lambda "return std::string(\"Bearer \") + id(display_client)->bearer();"
    on_download_finished:
      # THE TRIGGER THAT WAS MISSING, TWICE OVER. art_primed was declared,
      # consulted by art_swap, and never set by anything — so the crossfade never
      # ran. And art_tick, the only thing that flushed a queued swap, was never
      # called either, so even a queued swap stayed queued forever. The incoming
      # cover, once decoded, sat there undisplayed.
      #
      # So: set the flag, then run the swap now if nothing is fading, and queue
      # it otherwise. Running it directly is what makes the FIRST cover appear —
      # there is no "previous swap" to have queued it.
      - lambda: |-
          id(art_primed) = true;
          if (!id(art_fading)) {
            id(art_swap).execute();
          } else {
            id(art_queued) = true;
          }
    on_error:
      - logger.log: "art_in: nothing to show yet"

  # There was a station_logo_image here, feeding a station_logo image widget that
  # was one of the fourteen removed above. Nothing else referenced it, so it went
  # with them — an unused online_image is not free. It still allocates its buffer,
  # and it has `update_interval: 1h`, so it was waking the radio once an hour to
  # fetch a picture that had nothing to display it in.

  # ---- presenter avatars, one per schedule row ----------------------------
  #
  # FIVE SEPARATE BUFFERS, and that is the point rather than an oversight. An
  # avatar belongs to one row and only ever appears on that row's expanded tray,
  # so five 56x56 buffers cost about 30KB together — which buys the thing that
  # matters: showing a face never delays the row it sits on. One shared buffer
  # would make five rows fight over it, and a schedule that reflows while you are
  # reading it is worse than one with no faces at all.
  - id: row_0_avatar_image
    http_request_id: shared_http
    url: "http://192.168.4.1/api/devices/avatar/none.png"
    format: PNG
    type: BINARY
    resize: 56x56
    buffer_size: 8192
    update_interval: never
    on_error:
      - logger.log: "row_0: no avatar"

  - id: row_1_avatar_image
    http_request_id: shared_http
    url: "http://192.168.4.1/api/devices/avatar/none.png"
    format: PNG
    type: BINARY
    resize: 56x56
    buffer_size: 8192
    update_interval: never
    on_error:
      - logger.log: "row_1: no avatar"

  - id: row_2_avatar_image
    http_request_id: shared_http
    url: "http://192.168.4.1/api/devices/avatar/none.png"
    format: PNG
    type: BINARY
    resize: 56x56
    buffer_size: 8192
    update_interval: never
    on_error:
      - logger.log: "row_2: no avatar"

  - id: row_3_avatar_image
    http_request_id: shared_http
    url: "http://192.168.4.1/api/devices/avatar/none.png"
    format: PNG
    type: BINARY
    resize: 56x56
    buffer_size: 8192
    update_interval: never
    on_error:
      - logger.log: "row_3: no avatar"

  - id: row_4_avatar_image
    http_request_id: shared_http
    url: "http://192.168.4.1/api/devices/avatar/none.png"
    format: PNG
    type: BINARY
    resize: 56x56
    buffer_size: 8192
    update_interval: never
    on_error:
      - logger.log: "row_4: no avatar"

# ---------------------------------------------------------------------------
# LVGL initialization state.
globals:
  - id: lvgl_ready
    type: bool
    restore_value: no
    initial_value: 'false'

# ---------------------------------------------------------------------------
# Screen rotation script.
script:
  - id: apply_screen_rotation
    mode: restart
    then:
      - lambda: |-
          // Apply the orientation from device settings using native LVGL rotation
          const char* orient = id(display_client)->settings().orientation.c_str();
          if (strcmp(orient, "portrait") == 0) {
            id(tft_display).set_rotation(esphome::display::DISPLAY_ROTATION_0_DEGREES);
          } else if (strcmp(orient, "landscape") == 0) {
            id(tft_display).set_rotation(esphome::display::DISPLAY_ROTATION_90_DEGREES);
          }

# ---------------------------------------------------------------------------
# Fonts.
#
# THREE, AND THREE IS THE BUDGET. 16MB of flash holds one merged factory image
# and there is not much room to be generous. Adding a fourth is a decision, not a
# detail.
#
# Newsreader for the track title, Archivo for everything else. Deliberately NOT
# the web app's Outfit: a serif display face is the voice of a radio station, and
# a wall screen seen from across a room is the one place that voice is legible.
# See device/design.md.
#
# ONE GLYPH SET, SHARED BY ALL THREE. These are subsets, not full Latin: the
# fold across two lines produces exactly one space glyph, which is the whole
# trick to keeping a 4bpp face small enough to ship three of.
# ---------------------------------------------------------------------------
font:
  - file: "gfonts://Newsreader@Semi-bold"
    id: font_title
    size: 48
    bpp: 4
    glyphs: >-
      !"#$%&()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`
      abcdefghijklmnopqrstuvwxyz{|}~©°·—'…

  - file: "gfonts://Archivo@Medium"
    id: font_body
    size: 26
    bpp: 4
    glyphs: >-
      !"#$%&()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`
      abcdefghijklmnopqrstuvwxyz{|}~©°·—'…

  - file: "gfonts://Archivo@Medium"
    id: font_small
    size: 18
    bpp: 4
    glyphs: >-
      !"#$%&()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`
      abcdefghijklmnopqrstuvwxyz{|}~©°·—'…