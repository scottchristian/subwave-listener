# ---------------------------------------------------------------------------
# Artwork.
#
# `online_image` rather than a baked-in `image:`, because the cover changes every
# few minutes and a wall screen cannot be reflashed each time. It also ships
# `online_image.set_url` and `online_image.release`, which is what theme.yaml's
# art_swap needs to hold the outgoing cover until the incoming one has actually
# decoded.
#
# RGB565, BINARY, resized at decode. The panel is RGB565 and resizing on the
# device rather than asking the station for a 520px cover keeps the download
# buffer small — which on hex-mode PSRAM is not a detail.
#
# THE INITIAL URL IS DELIBERATELY A 404. There is no artwork until the station
# says what is playing, and pointing these at a placeholder file that does not
# exist gets the same result — an empty surface — without shipping a placeholder
# and without pretending the screen has a cover it does not.
# ---------------------------------------------------------------------------
online_image:
  - id: art_out_image
    http_request_id: shared_http
    url: "http://192.168.4.1/api/devices/art/none.jpg"
    format: JPEG
    type: RGB565
    resize: 520x520
    buffer_size: ${art_buffer_bytes}
    update_interval: never
    # The art route is bearer-protected; without this every fetch 401s and the
    # cover stays blank. The header is templated so it is read at fetch time,
    # after the claim has stored the token.
    request_headers:
      Authorization: !lambda "return std::string(\"Bearer \") + id(display_client)->bearer();"
    on_download_finished:
      - lambda: |-
          ESP_LOGI("subwave.art", "Cover decoded into art_out_image (%dx%d)",
                   id(art_out_image)->get_width(), id(art_out_image)->get_height());
          lv_image_set_src(id(art_in), id(art_out_image)->get_lv_image_dsc());
          id(art_primed) = true;
          if (!id(art_fading)) {
            id(art_swap).execute();
          } else {
            id(art_queued) = true;
          }
    on_error:
      - lambda: |-
          ESP_LOGW("subwave.art", "art_out_image: download or decode failed");
          id(display_client)->on_art_error();

  - id: art_in_image
    http_request_id: shared_http
    url: "http://192.168.4.1/api/devices/art/none.jpg"
    format: JPEG
    type: RGB565
    resize: 520x520
    buffer_size: ${art_buffer_bytes}
    update_interval: never
    request_headers:
      Authorization: !lambda "return std::string(\"Bearer \") + id(display_client)->bearer();"
    on_download_finished:
      # THE TRIGGER THAT WAS MISSING, TWICE OVER. art_primed was declared,
      # consulted by art_swap, and never set by anything — so the crossfade never
      # ran. And art_tick, the only thing that flushed a queued swap, was never
      # called either, so even a queued swap stayed queued forever. The incoming
      # cover, once decoded, sat there undisplayed.
      #
      # Also: ESPHome's Image::get_lv_image_dsc() lazily populates its LVGL
      # descriptor ONLY when called, and at boot `data_start_` is nullptr — so
      # lv_image_set_src() at boot leaves `img->src == NULL`. Re-binding here
      # after end_decode() hands LVGL the newly allocated RGB565 pixel buffer.
      - lambda: |-
          ESP_LOGI("subwave.art", "Cover decoded into art_in_image (%dx%d)",
                   id(art_in_image)->get_width(), id(art_in_image)->get_height());
          lv_image_set_src(id(art_in), id(art_in_image)->get_lv_image_dsc());
          id(art_primed) = true;
          if (!id(art_fading)) {
            id(art_swap).execute();
          } else {
            id(art_queued) = true;
          }
    on_error:
      - lambda: |-
          ESP_LOGW("subwave.art", "art_in_image: download or decode failed");
          id(display_client)->on_art_error();

