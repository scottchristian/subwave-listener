# Panel, touch, and LVGL.
#
# The panel block itself lives in panel.yaml (or whatever `panel_include`
# names) so that it can be swapped without touching anything below.
#
# THE PANEL IS 800x1280 PORTRAIT. The UI is 1280x800 landscape, driven by a
# rotation rather than by the panel being landscape. Getting that backwards
# produces a screen that is alive, responsive, and mirrored — so it is worth
# knowing before you spend an afternoon on it.
display: !include ${panel_include}

touchscreen:
  - platform: gsl3680
    id: tft_touch
    display: tft_display
    reset_pin: GPIO22
    interrupt_pin: GPIO21
    touch_timeout: 50ms
    transform:
      mirror_x: true
      # VERIFIED IN PHASE 2 BEFORE ANYTHING ELSE. A wrong touch transform makes
      # every later step unverifiable: you cannot tell a layout bug from a
      # coordinate bug, and both look like "the button does nothing".
      mirror_y: false
    # WAKING & DIAGNOSTICS TOUCH LISTENERS:
    # "Waking is touch-only" (device/design.md) because there is no audio
    # here and so no user activity to measure — a track change or a heartbeat
    # must not light up a screen in an empty room.
    on_touch:
      - lambda: |-
          ESP_LOGI("subwave.touch", "Touch down at (%d, %d)", touch.x, touch.y);
      - script.execute: idle_arm
    on_release:
      - lambda: |-
          ESP_LOGI("subwave.touch", "Touch release");

# WiFi is a SEPARATE ESP32-C6 on SPI, so the display and the network are
# coupled only by the fact that they share a board.
#
# NO SEPARATE `spi:` BLOCK. An earlier version of this file declared one with
# clk/mosi/miso AND passed `spi_id:` here — which double-declared GPIO16 and
# GPIO17 as both SPI data and the C6's d2/d3, and `spi_id` is not an option this
# component accepts at all. The pins are declared once, here, exactly as the
# reference board config for this panel does it.
esp32_hosted:
  variant: esp32c6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true

lvgl:
  id: main_lvgl
  # 6% is the reference project's value for this panel and it is deliberate.
  buffer_size: 6%
  # The P4 software rotation path uses PPA/DMA, so rotated draw chunks want a
  # cache-line-friendly RGB565 boundary rather than LVGL's 2-pixel default.
  # Do not change this without measuring.
  draw_rounding: 32
  byte_order: little_endian
  rotation: ${display_rotation}

  # The reference project has this on_boot sequence to initialize LVGL properly.
  # Without it, the display may not initialize properly and remain blank.
  on_boot:
    - lambda: |
        id(lvgl_ready) = true;
    - script.execute: apply_screen_rotation

  pages:
    - id: main_page
      scrollbar_mode: "off"
      scrollable: false
      width: 100%
      height: 100%
      bg_color: 0x000000
      pad_top: 0
      pad_bottom: 0
      pad_left: 0
      pad_right: 0

      widgets:
        # ---------------------------------------------------------------------------
        # WHAT WAS HERE, AND WHY IT IS GONE.
        #
        # Fourteen widgets inherited from the reference board's config: an artwork
        # backdrop, two cover images, an "artwork unavailable" label, a 480px
        # opaque black accent panel, a track-info panel with its own title / artist
        # / time labels, a play/pause button, a progress bar and a station logo.
        #
        # NOT ONE OF THEM WAS BOUND OR REFERENCED. Each screen carries its own
        # artwork, its own title and its own logo, and every one of these ids
        # appears in no bind_object() call and in no OBJ() in the C++. They were
        # also, unavoidably, invisible: they are siblings of window_stack rather
        # than children of it, and window_stack is declared after them, so all
        # three windows — each with an opaque background — were painted over the
        # lot.
        #
        # They stayed anyway, and that is the problem. The accent panel is 480px of
        # solid black on the RIGHT-HAND side of the screen, which is exactly where
        # now.yaml puts the cover — so to anyone reading this file it looks
        # deliberately placed to hide the artwork. And the play/pause button was
        # wired to skip_toggle, which toggles a SETTING, so a reader would
        # reasonably conclude there was a working media control wired to the wrong
        # thing.
        #
        # Inert code sitting in the wrong place is still wrong, and worse than
        # missing code: the next person to move an artwork x-coordinate spends an
        # afternoon on a panel that was never on screen.
        # ---------------------------------------------------------------------------

        # ---- the sliding stack (three windows + setup + sleep hint) ----
        - obj:
            id: window_stack
            width: 100%
            height: 100%
            align: TOP_LEFT
            scrollable: false
            bg_color: 0x06101E
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            radius: 0
            widgets:
              # 1 of 3 — what is playing.
              - obj:
                  id: window_0
                  width: 100%
                  height: 100%
                  align: TOP_LEFT
                  scrollable: false
                  bg_color: 0x06101E
                  bg_opa: COVER
                  border_width: 0
                  pad_all: 0
                  radius: 0
                  widgets: !include screens/now.yaml

              # 2 of 3 — the show list.
              - obj:
                  id: window_1
                  width: 100%
                  height: 100%
                  align: TOP_LEFT
                  scrollable: false
                  bg_color: 0x06101E
                  bg_opa: COVER
                  border_width: 0
                  pad_all: 0
                  radius: 0
                  widgets: !include screens/shows.yaml

              # 3 of 3 — the screen's own settings.
              - obj:
                  id: window_2
                  width: 100%
                  height: 100%
                  align: TOP_LEFT
                  scrollable: false
                  bg_color: 0x06101E
                  bg_opa: COVER
                  border_width: 0
                  pad_all: 0
                  radius: 0
                  widgets: !include screens/settings.yaml

              # The provisioning screens. Two slots in the same stack: Wi-Fi,
              # then bind-to-station. Navigated with window_go (targets 3, 4).
              - obj:
                  id: setup_wifi_screen
                  width: 100%
                  height: 100%
                  align: TOP_LEFT
                  scrollable: false
                  bg_color: 0x06101E
                  bg_opa: COVER
                  border_width: 0
                  pad_all: 0
                  radius: 0
                  widgets: !include screens/setup_wifi.yaml

              - obj:
                  id: setup_bind_screen
                  width: 100%
                  height: 100%
                  align: TOP_LEFT
                  scrollable: false
                  bg_color: 0x06101E
                  bg_opa: COVER
                  border_width: 0
                  pad_all: 0
                  radius: 0
                  widgets: !include screens/setup_bind.yaml

              # The asleep notice — the last slot, bare label.
              - label:
                  id: sleep_hint
                  width: 100%
                  height: 100%
                  align: TOP_LEFT
                  text_color: 0x6A8BA8
                  text_font: font_body
                  text_align: CENTER
                  hidden: true

        # ---- chrome: navigation dock for the 3 station screens (hidden during setup) ----
        - obj:
            id: chrome
            width: 100%
            height: 72px
            align: BOTTOM_LEFT
            scrollable: false
            bg_color: 0x06101E
            bg_opa: COVER
            border_width: 0
            pad_all: 0
