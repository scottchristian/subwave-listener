# The setup screen — page 1 of 2: connect to Wi-Fi.
#
# DESIGN: Frontend-design principles applied.
#
# Subject: Wall-mounted SUB/WAVE radio display. Thin client, provisioned once.
# Audience: Anyone standing in front of the screen — cafe staff, venue staff,
# the station owner. Not technical, not patient, not carrying a laptop.
# Primary job: Get this screen on WiFi and claimed to the station, fast.
#
# Hero: The QR code. It's the fastest path — phone scans, captive portal does
# the rest. Everything else on the screen is the fallback for when a phone
# isn't handy.
#
# Layout: Single column, left-aligned. Everything fits within 800px height.
# The bottom 72px is the chrome rail — keyboard never goes below y=700px.
#
# Page 1 of 2: connect to Wi-Fi. Tap "Next →" to go to the bind screen.
#
# The CONTENT of the setup screen — the widgets only.

# ── Top: phone-first setup ──────────────────────────────────────────────

- label:
    id: setup_title
    text: "Connect to Wi-Fi"
    text_font: font_title
    text_color: 0xDCE8F5
    align: TOP_LEFT
    x: 40px
    y: 12px

- label:
    id: setup_instruction
    text: "If Wi-Fi already works, tap Next to bind this screen to your station."
    text_font: font_body
    text_color: 0x6A8BA8
    align: TOP_LEFT
    x: 40px
    y: 64px
    width: 1200px

- qrcode:
    id: setup_qr
    size: 280
    align: TOP_LEFT
    x: 40px
    y: 112px
    light_color: 0xE8EDF3
    dark_color: 0x0B1A2B
    text: "WIFI:T:WPA;S:SUBWAVE-SCREEN;P:D2P2K7FF;;"

# ── Beside the QR: what the QR does, and what to type if you would rather ──
- label:
    id: setup_hint
    text: "Scan with your phone to join. The setup page opens by itself."
    text_font: font_body
    text_color: 0x6A8BA8
    align: TOP_LEFT
    x: 380px
    y: 112px
    width: 860px

- label:
    id: setup_wifi_label
    text: "Network"
    text_font: font_small
    text_color: 0x6A8BA8
    align: TOP_LEFT
    x: 380px
    y: 216px
    width: 300px

- label:
    id: setup_wifi_value
    text: "SUBWAVE-SCREEN"
    text_font: font_body
    text_color: 0xDCE8F5
    align: TOP_LEFT
    x: 380px
    y: 244px
    width: 400px

- label:
    id: setup_password_label
    text: "Password"
    text_font: font_small
    text_color: 0x6A8BA8
    align: TOP_LEFT
    x: 380px
    y: 292px
    width: 300px

- label:
    id: setup_password_value
    text: "D2P2K7FF"
    text_font: font_body
    text_color: 0xDCE8F5
    align: TOP_LEFT
    x: 380px
    y: 320px
    width: 300px

# A HAIRLINE, NOT A DIVIDER FOR ITS OWN SAKE.
- obj:
    id: setup_rule
    width: 1200px
    height: 1px
    align: TOP_LEFT
    x: 40px
    y: 352px
    bg_color: 0x1A3050
    bg_opa: COVER
    border_width: 0

# ── Bottom: on-screen Wi-Fi setup ───────────────────────────────────────

- label:
    id: setup_home_label
    text: "Or set it up here"
    text_font: font_small
    text_color: 0x6A8BA8
    align: TOP_LEFT
    x: 40px
    y: 364px
    width: 400px

- button:
    id: setup_scan_button
    text: "Scan"
    align: TOP_LEFT
    x: 40px
    y: 412px
    width: 100px
    height: 40px
    bg_color: 0x0D1F35
    border_width: 0
    radius: 8px
    text_color: 0xDCE8F5
    text_font: font_body
    on_click:
      - script.execute: wifi_scan

- dropdown:
    id: wifi_network_dropdown
    align: TOP_LEFT
    x: 160px
    y: 412px
    width: 1080px
    height: 40px
    options:
      - "Scanning…"
    symbol: "›"

- label:
    id: setup_password_label2
    text: "Password"
    text_font: font_small
    text_color: 0x6A8BA8
    align: TOP_LEFT
    x: 40px
    y: 456px
    width: 200px

- textarea:
    id: wifi_password
    align: TOP_LEFT
    x: 40px
    y: 484px
    width: 400px
    height: 40px
    one_line: true
    password_mode: true
    placeholder_text: "Network password"
    on_click:
      - lambda: id(keyboard_target) = 0;
      - script.execute: wifi_keyboard_toggle

- button:
    id: setup_connect_button
    text: "Connect"
    align: TOP_LEFT
    x: 460px
    y: 484px
    width: 140px
    height: 40px
    bg_color: 0x0D1F35
    border_width: 0
    radius: 8px
    text_color: 0xDCE8F5
    text_font: font_body
    on_click:
      - script.execute: wifi_connect

- label:
    id: wifi_status
    text: ""
    text_font: font_body
    text_color: 0x4E9FD4
    align: TOP_LEFT
    x: 620px
    y: 484px
    width: 620px

- button:
    id: setup_next_button
    text: "Next →"
    align: TOP_LEFT
    x: 1060px
    y: 484px
    width: 140px
    height: 40px
    bg_color: 0x0D1F35
    border_width: 0
    radius: 8px
    text_color: 0x4E9FD4
    text_font: font_body
    on_click:
      - script.execute: { id: window_go, target: 4 }

# ── The on-screen keyboard ──────────────────────────────────────────────
# Hidden until a field is tapped. Sits at the bottom with a safe margin so
# all four rows of keys are visible above the chrome rail.
# Mode buttons sit above the keyboard, shown when typing.

- button:
    id: wifi_mode_lower
    text: "abc"
    align: TOP_LEFT
    x: 460px
    y: 484px
    width: 136px
    height: 40px
    bg_color: 0x0D1F35
    border_width: 0
    radius: 8px
    text_color: 0xDCE8F5
    text_font: font_body
    hidden: true
    on_click:
      - script.execute: { id: wifi_keyboard_mode, mode: 0 }

- button:
    id: wifi_mode_upper
    text: "ABC"
    align: TOP_LEFT
    x: 604px
    y: 484px
    width: 136px
    height: 40px
    bg_color: 0x0D1F35
    border_width: 0
    radius: 8px
    text_color: 0xDCE8F5
    text_font: font_body
    hidden: true
    on_click:
      - script.execute: { id: wifi_keyboard_mode, mode: 1 }

- button:
    id: wifi_mode_special
    text: "#+="
    align: TOP_LEFT
    x: 748px
    y: 484px
    width: 136px
    height: 40px
    bg_color: 0x0D1F35
    border_width: 0
    radius: 8px
    text_color: 0xDCE8F5
    text_font: font_body
    hidden: true
    on_click:
      - script.execute: { id: wifi_keyboard_mode, mode: 2 }

- button:
    id: wifi_mode_number
    text: "123"
    align: TOP_LEFT
    x: 892px
    y: 484px
    width: 136px
    height: 40px
    bg_color: 0x0D1F35
    border_width: 0
    radius: 8px
    text_color: 0xDCE8F5
    text_font: font_body
    hidden: true
    on_click:
      - script.execute: { id: wifi_keyboard_mode, mode: 3 }

- button:
    id: wifi_keyboard_done
    text: "Done"
    align: TOP_LEFT
    x: 1036px
    y: 484px
    width: 104px
    height: 40px
    bg_color: 0x0D1F35
    border_width: 0
    radius: 8px
    text_color: 0xDCE8F5
    text_font: font_body
    hidden: true
    on_click:
      - script.execute: wifi_keyboard_toggle

- keyboard:
    id: wifi_kb
    align: TOP_LEFT
    x: 40px
    y: 532px
    width: 1200px
    height: 168px
    textarea: wifi_password
    mode: TEXT_LOWER
    hidden: true

- label:
    id: setup_address
    text: "—"
    text_font: font_body
    text_color: 0x4E9FD4
    align: BOTTOM_RIGHT
    x: -40px
    y: -24px
