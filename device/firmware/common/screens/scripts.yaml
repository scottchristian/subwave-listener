# The screens' own scripts and state, separated from their widgets.
#
# These were the `script:` and `globals:` blocks that sat beside each screen's
#
# widget tree. Once a screen file became a bare list of widgets — because a
#
# widget's parent is now the `widgets:` list it sits in, and only the enclosing
#
# file can supply that — those blocks had nowhere to live.
#
# They are together rather than split back across the screens because a package
#
# file may declare each top-level key exactly once, and two files both wanting
#
# `script:` is only a problem once they are merged into one.
#
#

globals:
  - id: idle_deadline_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: screen_asleep
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: keyboard_target
    type: int
    restore_value: no
    initial_value: '0'
  - id: setup_page
    type: int
    restore_value: no
    initial_value: '3'


script:
  - id: set_brightness_to
    mode: restart
    parameters:
      value: int
    then:
      - lambda: |-
          auto *c = id(display_client);
          c->settings_draft().brightness = value;
          auto draft = c->settings_draft();
          c->push_settings(draft);
          subwave_display::settings_refresh();
          float v = (float) value / 100.0f;
          auto *light = id(backlight);
          auto call = light->make_call();
          call.set_state(true);
          call.set_brightness(v);
          call.set_transition_length(800);
          call.perform();
          ESP_LOGI("subwave.settings", "Manual brightness set to %d%% (%.2f).", value, v);

  - id: theme_cycle
    mode: single
    then:
      - lambda: |-
          auto *c = id(display_client);
          std::string m = c->settings().theme_mode;
          m = (m == "auto") ? "day" : (m == "day") ? "night" : "auto";
          c->settings_draft().theme_mode = m;
          auto draft = c->settings_draft();
          c->push_settings(draft);
          subwave_display::settings_refresh();

  - id: idle_cycle
    mode: single
    then:
      - lambda: |-
          auto *c = id(display_client);
          std::string m = c->settings().idle_mode;
          m = (m == "stay") ? "dim" : (m == "dim") ? "off" : "stay";
          c->settings_draft().idle_mode = m;
          auto draft = c->settings_draft();
          c->push_settings(draft);
          subwave_display::settings_refresh();

  - id: orientation_cycle
    mode: single
    then:
      # REBOOTS. `display_rotation` is compile-time on this panel and there is no
      # clean runtime path, so the setting applies and the screen restarts. The
      # label says so, because a screen that silently restarts looks broken.
      - lambda: |-
          auto *c = id(display_client);
          c->settings_draft().orientation =
              (c->settings().orientation == "landscape") ? "portrait" : "landscape";
          auto draft = c->settings_draft();
          c->push_settings(draft);
          subwave_display::settings_refresh();
          ESP_LOGW("subwave.settings", "Orientation changed; the screen restarts to turn on its side.");
          App.safe_reboot();

  - id: skip_toggle
    mode: single
    then:
      - lambda: |-
          auto *c = id(display_client);
          c->settings_draft().skip_enabled = !c->settings().skip_enabled;
          auto draft = c->settings_draft();
          c->push_settings(draft);
          subwave_display::settings_refresh();

  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # WHY THE CALLS IN THIS FILE LOOK MIXED.
  #
  # ESPHome 2026.7 wraps a widget in a typed C++ class (`LvDropdownType`,
  # `LvPageType`) ONLY for the handful of widget kinds that expose a typed API —
  # two of them in this build. Every other widget — every label, every obj, the
  # textarea — is emitted as a bare `lv_obj_t *`, and `lv_obj_t` is only ever
  # forward-declared before a lambda, so it is an INCOMPLETE TYPE there.
  #
  # That has exactly two consequences, and this file obeys both:
  #
  #   - `id(wifi_status).set_text(...)` cannot compile. Calling a member on a
  #     pointer to an incomplete type requires the complete type.
  #   - `id(window_0)->obj` cannot compile, for the same reason. There is no
  #     `.obj` member — `id(window_0)` IS the pointer.
  #
  # So: raw widgets are driven through the LVGL C API, which takes `lv_obj_t *`
  # BY VALUE and never dereferences it at the call site. And the dropdown, which
  # does have a real class, is driven through it. `->obj` appears only on typed
  # widgets, and a bare `id(x)` only where a raw pointer is wanted.
  #
  # An array of pointers to an incomplete type is fine, so indexing `wins[]`
  # below is legal.
  # ---------------------------------------------------------------------------
  # On-screen WiFi setup — scan, pick, connect.
  #
  # The WiFi credentials can also be set from a phone that has joined the
  # SUBWAVE-SCREEN access point; the captive portal serves the wizard with no URL
  # to type. The on-screen path is the fallback for when no phone is to hand:
  # scan for networks, pick one, enter a password, connect.
  - id: wifi_scan
    mode: single
    then:
      - lambda: |-
          id(setup_web)->request_scan();
          lv_label_set_text(id(wifi_status), "Scanning…");

  # Start a scan at boot, and watch it land.
  #
  # A list that only exists on glass cannot be debugged with a serial cable and
  # no display — which is exactly the situation when a scan returns nothing. The
  # per-network log lives in subwave_setup_web's scan listener, which fires at
  # the one moment the results are valid. This script starts the scan and then
  # reports whether it landed.
  #
  # WHY THERE IS NO WAIT BEFORE READING. An earlier version slept 10s and then
  # read get_scan_result(), which reports zero results on a scan that is merely
  # still running. ESPHome's own scan timeout is 31s, so a 10s read was reporting
  # "nothing there" for two thirds of the time a scan is allowed to take. The
  # screen now asks subwave_setup_web whether a scan has actually landed.
  - id: wifi_scan_log
    mode: restart
    then:
      - delay: 4s
      - lambda: |-
          auto *wifi = wifi::global_wifi_component;
          if (wifi != nullptr && (wifi->has_sta() || wifi->is_connected())) {
            ESP_LOGI("subwave.setup", "Saved Wi-Fi configured; skipping automatic boot scan.");
            return;
          }
          ESP_LOGI("subwave.setup", "Starting a WiFi scan for the on-screen list.");
          id(setup_web)->request_scan();
      - repeat:
          count: 20
          then:
            - delay: 2s
            - lambda: |-
                auto *wifi = wifi::global_wifi_component;
                if (wifi != nullptr && (wifi->has_sta() || wifi->is_connected()))
                  return;
                id(setup_web)->log_radio_state();
      - lambda: |-
          auto *wifi = wifi::global_wifi_component;
          if (wifi != nullptr && (wifi->has_sta() || wifi->is_connected()))
            return;
          ESP_LOGW("subwave.setup", "No scan result after 40s. A scan that reports nothing "
                                   "and a scan that never finished look identical from here.");
          wifi_populate_dropdown->execute();

  # Fill the picker.
  #
  # MESH NETWORKS REPORT THE SAME SSID FROM EVERY RADIO IN THE MESH, so a naive
  # pass fills the dropdown with four copies of "home_automation" and the picker
  # becomes unusable — and worse, the copies are in radio-discovery order, so the
  # signal a phone would actually get from the one it picks is not the signal
  # shown. So: dedupe by SSID, keep the strongest RSSI, then sort strongest
  # first. One entry per network, and the top entry is the one to pick.
  - id: wifi_populate_dropdown
    mode: single
    then:
      - lambda: |-
          if (!id(setup_web)->scan_completed()) {
            lv_label_set_text(id(wifi_status), "Still scanning for networks...");
            return;
          }

          std::map<std::string, int> best;
          auto &results = wifi::global_wifi_component->get_scan_result();
          for (auto &scan : results) {
            if (scan.get_is_hidden())
              continue;
            std::string ssid{scan.get_ssid().c_str()};
            if (ssid.empty())
              continue;
            int rssi = scan.get_rssi();
            auto it = best.find(ssid);
            if (it == best.end() || rssi > it->second)
              best[ssid] = rssi;
          }

          std::vector<std::pair<int, std::string>> sorted;
          sorted.reserve(best.size());
          for (auto &kv : best)
            sorted.emplace_back(kv.second, kv.first);
          std::sort(sorted.begin(), sorted.end(),
                    [](const std::pair<int, std::string> &a, const std::pair<int, std::string> &b) {
                      if (a.first != b.first) return a.first > b.first;
                      return a.second < b.second;
                    });

          std::vector<std::string> options;
          options.reserve(sorted.size());
          for (auto &entry : sorted)
            options.push_back(entry.second);

          ESP_LOGI("subwave.setup", "%u result(s) collapsed to %u network(s).",
                   (unsigned) results.size(), (unsigned) options.size());
          if (options.empty())
            options.push_back("No networks found");

          id(wifi_network_dropdown)->set_options(options);
          lv_label_set_text(id(wifi_status), options.size() == 1 && options[0] == "No networks found"
                                              ? "No networks found."
                                              : "Pick a network and enter password.");

  # ---------------------------------------------------------------------------
  # Test the server connection. Normalises the URL (adds https:// if no scheme)
  # and checks DNS + TCP. If it works, the bind code field is ready to use.
  # ---------------------------------------------------------------------------
  - id: bind_test_connection
    mode: single
    then:
      - lambda: |-
          const char *raw = lv_textarea_get_text(id(bind_server_url));
          std::string url = raw ? raw : "";
          while (!url.empty() && (url.front() == ' ' || url.front() == '\t')) url.erase(url.begin());
          while (!url.empty() && (url.back() == ' ' || url.back() == '\t' || url.back() == '/')) url.pop_back();
          if (url.empty()) {
            lv_label_set_text(id(bind_status), "Enter a server address first.");
            return;
          }
          if (url.find("://") == std::string::npos) {
            url = "https://" + url;
            lv_textarea_set_text(id(bind_server_url), url.c_str());
          }
          auto *c = id(display_client);
          c->set_server_url(url);

          lv_label_set_text(id(bind_status), "Testing connection to server...");
          auto result = c->check_connectivity();
          if (result == subwave_display::SubwaveDisplay::Connectivity::OK ||
              result == subwave_display::SubwaveDisplay::Connectivity::NO_SERVER) {
            if (result == subwave_display::SubwaveDisplay::Connectivity::OK) {
              lv_label_set_text(id(bind_status), "Server reachable! Enter bind code and tap Bind Station.");
            } else {
              lv_label_set_text(id(bind_status), "Server not responding. Check the address.");
            }
          } else {
            const char *msg = c->connectivity_message(result);
            lv_label_set_text(id(bind_status), msg);
          }

  # Bind the device to the station. Uses the server URL and bind code from the
  # on-screen fields. On success, stores identity in flash and reboots.
  - id: bind_device
    mode: single
    then:
      - lambda: |-
          const char *url_raw = lv_textarea_get_text(id(bind_server_url));
          const char *code_raw = lv_textarea_get_text(id(bind_code));
          std::string url = url_raw ? url_raw : "";
          std::string code = code_raw ? code_raw : "";
          while (!url.empty() && (url.front() == ' ' || url.front() == '\t')) url.erase(url.begin());
          while (!url.empty() && (url.back() == ' ' || url.back() == '\t' || url.back() == '/')) url.pop_back();
          while (!code.empty() && (code.front() == ' ' || code.front() == '\t')) code.erase(code.begin());
          while (!code.empty() && (code.back() == ' ' || code.back() == '\t')) code.pop_back();
          if (url.empty() || code.empty()) {
            lv_label_set_text(id(bind_status), "Enter both the server address and bind code.");
            return;
          }
          if (url.find("://") == std::string::npos) {
            url = "https://" + url;
            lv_textarea_set_text(id(bind_server_url), url.c_str());
          }
          lv_label_set_text(id(bind_status), "Binding station display...");
          auto *c = id(display_client);
          c->set_server_url(url);
          c->set_bind_code(code);
          if (c->bind(url, code)) {
            lv_label_set_text(id(bind_status), "Bound! Rebooting...");
            App.safe_reboot();
          } else {
            lv_label_set_text(id(bind_status), "Bind failed. Check the code and try again.");
          }

  - id: wifi_keyboard_toggle
    mode: single
    then:
      - lambda: |-
          // Choose the keyboard that matches the target field (or active setup screen when closing).
          // keyboard_target: 0 = wifi_password, 2 = bind_server_url, 3 = bind_code, -1 = close keyboard
          bool on_wifi = (id(keyboard_target) == 0) ||
                         (id(keyboard_target) < 0 && id(window_index) == 3 && id(setup_page) == 3);
          lv_obj_t *kb_sel = on_wifi ? id(wifi_kb).obj : id(bind_kb).obj;
          bool kb_was_hidden = (id(keyboard_target) >= 0) && lv_obj_has_flag(kb_sel, LV_OBJ_FLAG_HIDDEN);

          // Action controls on the password row hide while typing so the mode buttons fit cleanly.
          lv_obj_t *hidden_while_typing[] = {id(setup_connect_button), id(wifi_status)};
          lv_obj_t *shown_while_typing[] = {id(wifi_mode_lower), id(wifi_mode_upper), id(wifi_mode_special),
                                   id(wifi_mode_number), id(wifi_keyboard_done),
                                   id(bind_mode_lower), id(bind_mode_upper), id(bind_mode_special),
                                   id(bind_mode_number), id(bind_keyboard_done)};

          lv_obj_t *target = id(wifi_password);
          if (id(keyboard_target) == 2) target = id(bind_server_url);
          else if (id(keyboard_target) == 3) target = id(bind_code);

          if (kb_was_hidden) {
            // Keyboard was hidden — show it and focus the tapped textarea.
            lv_keyboard_set_textarea(kb_sel, target);
            lv_keyboard_set_mode(kb_sel, id(keyboard_target) == 3
                                             ? LV_KEYBOARD_MODE_TEXT_UPPER
                                             : LV_KEYBOARD_MODE_TEXT_LOWER);
            lv_obj_clear_flag(kb_sel, LV_OBJ_FLAG_HIDDEN);
            for (auto *o : hidden_while_typing)
              lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
            for (auto *o : shown_while_typing)
              lv_obj_clear_flag(o, LV_OBJ_FLAG_HIDDEN);
          } else if (id(keyboard_target) >= 0) {
            // Keyboard is already visible and user tapped a text field — retarget without hiding.
            lv_keyboard_set_textarea(kb_sel, target);
            if (id(keyboard_target) == 3) {
              lv_keyboard_set_mode(kb_sel, LV_KEYBOARD_MODE_TEXT_UPPER);
            } else if (id(keyboard_target) == 2) {
              lv_keyboard_set_mode(kb_sel, LV_KEYBOARD_MODE_TEXT_LOWER);
            }
          } else {
            // Explicit close (Done button or keyboard built-in Ready/Cancel key).
            lv_obj_add_flag(id(wifi_kb).obj, LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(bind_kb).obj, LV_OBJ_FLAG_HIDDEN);
            for (auto *o : hidden_while_typing)
              lv_obj_clear_flag(o, LV_OBJ_FLAG_HIDDEN);
            for (auto *o : shown_while_typing)
              lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
          }
          lv_obj_invalidate(kb_sel);

  # Switch the keyboard's character set.
  - id: wifi_keyboard_mode
    mode: restart
    parameters:
      mode: int
    then:
      - lambda: |-
          static const lv_keyboard_mode_t modes[4] = {
              LV_KEYBOARD_MODE_TEXT_LOWER,
              LV_KEYBOARD_MODE_TEXT_UPPER,
              LV_KEYBOARD_MODE_SPECIAL,
              LV_KEYBOARD_MODE_NUMBER,
          };
          if (mode < 0 || mode > 3)
            return;
          lv_keyboard_set_mode(id(wifi_kb).obj, modes[mode]);
          lv_keyboard_set_mode(id(bind_kb).obj, modes[mode]);

  - id: wifi_scan_landed
    mode: restart
    then:
      - script.execute: wifi_populate_dropdown

  - id: wifi_connect
    mode: single
    then:
      - lambda: |-
          std::string ssid = id(wifi_network_dropdown)->get_selected_text();
          const char *psk = lv_textarea_get_text(id(wifi_password));
          if (ssid.empty() || ssid == "No networks found" || ssid == "Scanning…") {
            lv_label_set_text(id(wifi_status), "Select a Wi-Fi network first.");
            return;
          }
          if (psk == nullptr)
            psk = "";
          lv_label_set_text(id(wifi_status), ("Connecting to " + ssid + "...").c_str());

          // Close keyboard if open.
          id(keyboard_target) = -1;
          wifi_keyboard_toggle->execute();

          // Show full-screen connection progress overlay while associating and testing.
          lv_label_set_text(id(boot_kicker), "WIFI CONNECTION");
          lv_label_set_text(id(boot_title), ("Connecting to " + ssid).c_str());
          lv_label_set_text(id(boot_step), "Trying to connect to Wi-Fi…");
          lv_label_set_text(id(boot_detail), "Step 1 of 3 · Associating with access point");
          lv_obj_set_width(id(boot_bar_fill), 160);
          lv_obj_clear_flag(id(boot_overlay), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(chrome), LV_OBJ_FLAG_HIDDEN);

          auto *wifi = wifi::global_wifi_component;
          wifi->save_wifi_sta(ssid, psk);
          wifi->retry_connect();
          wifi_connect_watchdog->execute();
          check_connectivity->execute();

  - id: wifi_connect_watchdog
    mode: restart
    then:
      - delay: 45s
      - lambda: |-
          if (wifi::global_wifi_component->is_connected())
            return;
          ESP_LOGW("subwave.setup",
                   "No association after 45s. Restarting so the setup access point comes back.");
          lv_label_set_text(id(boot_title), "Wi-Fi Connection Failed");
          lv_label_set_text(id(boot_step), "Could not join that network. Restarting setup…");
          lv_label_set_text(id(wifi_status), "Could not join that network. Restarting...");
          delay(1500);
          App.safe_reboot();

  # ---------------------------------------------------------------------------
  # Full-screen boot & connectivity test sequence.
  #
  # Drives `boot_overlay` step-by-step:
  #   Step 1: Waiting for Wi-Fi association ("Trying to connect to Wi-Fi…")
  #   Step 2: Testing local network & gateway
  #   Step 3: Testing internet & Subwave station reachability
  # ---------------------------------------------------------------------------
  - id: check_connectivity
    mode: restart
    then:
      - lambda: |-
          auto *wifi = wifi::global_wifi_component;
          if (wifi == nullptr || (!wifi->has_sta() && !wifi->is_connected())) {
            // No saved Wi-Fi credentials at all — stay on Wi-Fi setup screen.
            lv_obj_add_flag(id(boot_overlay), LV_OBJ_FLAG_HIDDEN);
            return;
          }
          lv_obj_clear_flag(id(boot_overlay), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(chrome), LV_OBJ_FLAG_HIDDEN);
          lv_label_set_text(id(boot_kicker), "SUBWAVE STATION DISPLAY");
          lv_label_set_text(id(boot_title), "Connecting to Wi-Fi");
          lv_label_set_text(id(boot_step), "Trying to connect to Wi-Fi…");
          lv_label_set_text(id(boot_detail), "Step 1 of 3 · Waiting for Wi-Fi connection");
          lv_obj_set_width(id(boot_bar_fill), 180);
      - repeat:
          count: 25
          then:
            - if:
                condition:
                  lambda: |-
                    auto *wifi = wifi::global_wifi_component;
                    return wifi == nullptr || !wifi->is_connected();
                then:
                  - delay: 1s
      - lambda: |-
          auto *wifi = wifi::global_wifi_component;
          if (wifi == nullptr || !wifi->has_sta()) {
            lv_obj_add_flag(id(boot_overlay), LV_OBJ_FLAG_HIDDEN);
            return;
          }
          if (!wifi->is_connected()) {
            lv_label_set_text(id(boot_title), "Wi-Fi Connection Timed Out");
            lv_label_set_text(id(boot_step), "Could not connect to saved Wi-Fi network");
            lv_label_set_text(id(boot_detail), "Opening Wi-Fi Setup…");
            lv_obj_set_width(id(boot_bar_fill), 560);
            return;
          }
          lv_label_set_text(id(boot_title), "Testing Network");
          lv_label_set_text(id(boot_step), "Wi-Fi connected · Testing local gateway…");
          lv_label_set_text(id(boot_detail), "Step 2 of 3 · Verifying IP address and router reachability");
          lv_obj_set_width(id(boot_bar_fill), 360);
      - delay: 500ms
      - lambda: |-
          auto *wifi = wifi::global_wifi_component;
          if (wifi == nullptr || !wifi->is_connected())
            return;
          lv_label_set_text(id(boot_title), "Testing Internet & Station");
          lv_label_set_text(id(boot_step), "Testing internet and station connection…");
          lv_label_set_text(id(boot_detail), "Step 3 of 3 · Checking DNS and Subwave server");
          lv_obj_set_width(id(boot_bar_fill), 480);
      - delay: 400ms
      - lambda: |-
          auto *wifi = wifi::global_wifi_component;
          auto *c = id(display_client);
          if (wifi == nullptr || !wifi->has_sta()) {
            lv_obj_add_flag(id(boot_overlay), LV_OBJ_FLAG_HIDDEN);
            return;
          }
          if (!wifi->is_connected()) {
            lv_obj_add_flag(id(boot_overlay), LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(id(wifi_status), "Could not connect to saved Wi-Fi. Pick a network below.");
            window_go->execute(3);
            wifi_scan->execute();
            return;
          }

          auto result = c->check_connectivity();
          const char *message = c->connectivity_message(result);
          lv_obj_set_width(id(boot_bar_fill), 560);
          bool bound = !c->device_id().empty() && !c->claim_token().empty() && !c->server_url().empty();

          // Unbound device with working Wi-Fi route: go straight to Bind Station (screen 4), NOT Wi-Fi setup!
          if (!bound &&
              result != subwave_display::SubwaveDisplay::Connectivity::NO_WIFI &&
              result != subwave_display::SubwaveDisplay::Connectivity::NO_ROUTE) {
            ESP_LOGI("subwave.setup", "Wi-Fi connected; device needs station bind. Opening Bind screen.");
            lv_obj_add_flag(id(boot_overlay), LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(id(status_line), "");
            window_go->execute(4);
            return;
          }

          if (result == subwave_display::SubwaveDisplay::Connectivity::OK && bound) {
            ESP_LOGI("subwave.setup", "All connectivity checks passed. Showing Now Playing.");
            lv_obj_add_flag(id(boot_overlay), LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(id(status_line), "");
            window_go->execute(0);
            c->refresh_now();
            return;
          }

          if (result == subwave_display::SubwaveDisplay::Connectivity::NO_SERVER) {
            lv_obj_add_flag(id(boot_overlay), LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(id(status_line), message);
            window_go->execute(0);
            ESP_LOGW("subwave.setup", "Staying on the main screen. %s", message);
            return;
          }

          ESP_LOGW("subwave.setup", "Setup IS needed: %s", message);
          lv_obj_add_flag(id(boot_overlay), LV_OBJ_FLAG_HIDDEN);
          lv_label_set_text(id(wifi_status), message);
          lv_label_set_text(id(status_line), "");
          window_go->execute(3);
          wifi_scan->execute();

  # ---------------------------------------------------------------------------
  # Skip — the primary playback control on the now-playing window.
  # ---------------------------------------------------------------------------
  - id: skip_press
    mode: single
    then:
      - lambda: |-
          auto *c = id(display_client);
          c->request_skip();
          c->refresh_now();

  # ---------------------------------------------------------------------------
  # Idle: arm, tick, wake.
  # ---------------------------------------------------------------------------
  - id: idle_tick
    mode: single
    then:
      - lambda: subwave_display::idle_poll();

  # Arm the deadline. Called at boot and again on every wake.
  - id: idle_arm
    mode: single
    then:
      - lambda: subwave_display::idle_touch();

  # ---------------------------------------------------------------------------
  # Initial boot window selection.
  #
  # When Wi-Fi credentials are already configured (`wifi->has_sta()`), we NEVER
  # flash the Wi-Fi setup screen at boot. Instead, `boot_overlay` covers the
  # screen with live step-by-step progress while Wi-Fi associates and runs
  # network/internet tests.
  # ---------------------------------------------------------------------------
  - id: boot_windows
    mode: single
    then:
      - lambda: |-
          // Ensure LVGL's built-in keyboard checkmark/close buttons also sync our UI state.
          auto kb_event_cb = [](lv_event_t *e) {
            lv_event_code_t code = lv_event_get_code(e);
            if (code == LV_EVENT_READY || code == LV_EVENT_CANCEL) {
              id(keyboard_target) = -1;
              id(wifi_keyboard_toggle)->execute();
            }
          };
          lv_obj_add_event_cb(id(wifi_kb).obj, kb_event_cb, LV_EVENT_ALL, nullptr);
          lv_obj_add_event_cb(id(bind_kb).obj, kb_event_cb, LV_EVENT_ALL, nullptr);

          // Bind codes are always "XXX-XXX", uppercase letters and digits. Format
          // them as they are typed so nobody has to find a dash key or shift.
          // Re-setting the text fires VALUE_CHANGED again, so only write when the
          // formatted text differs; the second pass is then a no-op.
          lv_textarea_set_max_length(id(bind_code), 7);
          auto bind_fmt_cb = [](lv_event_t *e) {
            lv_obj_t *ta = (lv_obj_t *) lv_event_get_target(e);
            const char *raw = lv_textarea_get_text(ta);
            std::string out;
            for (const char *p = raw; *p != '\0' && out.size() < 7; ++p) {
              char c = *p;
              if (c >= 'a' && c <= 'z') c = c - 'a' + 'A';
              if (!((c >= 'A' && c <= 'Z') || (c >= '0' && c <= '9'))) continue;
              if (out.size() == 3) out += '-';
              out += c;
            }
            if (out != raw) {
              lv_textarea_set_text(ta, out.c_str());
              lv_textarea_set_cursor_pos(ta, LV_TEXTAREA_CURSOR_LAST);
            }
          };
          lv_obj_add_event_cb(id(bind_code), bind_fmt_cb, LV_EVENT_VALUE_CHANGED, nullptr);

          lv_obj_add_flag(id(window_1), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(window_2), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(setup_wifi_screen), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(setup_bind_screen), LV_OBJ_FLAG_HIDDEN);

          auto *wifi = esphome::wifi::global_wifi_component;
          bool has_wifi = wifi != nullptr && (wifi->has_sta() || wifi->is_connected());
          if (has_wifi) {
            id(window_index) = 0;
            lv_obj_clear_flag(id(window_0), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_x(id(window_0), 0);
            lv_label_set_text(id(boot_kicker), "SUBWAVE STATION DISPLAY");
            lv_label_set_text(id(boot_title), "Connecting to Wi-Fi");
            lv_label_set_text(id(boot_step), "Trying to connect to Wi-Fi…");
            lv_label_set_text(id(boot_detail), "Step 1 of 3 · Waiting for Wi-Fi connection");
            lv_obj_set_width(id(boot_bar_fill), 140);
            lv_obj_clear_flag(id(boot_overlay), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(chrome), LV_OBJ_FLAG_HIDDEN);
            ESP_LOGI("subwave.ui", "Saved Wi-Fi present; showing full-screen connection progress.");
          } else {
            id(window_index) = 3;
            id(setup_page) = 3;
            lv_obj_add_flag(id(boot_overlay), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(window_0), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(setup_wifi_screen), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_x(id(setup_wifi_screen), 0);
            ESP_LOGI("subwave.ui", "No saved Wi-Fi; showing Wi-Fi setup screen.");
            window_draw_rail->execute();
          }

  # ---------------------------------------------------------------------------
  # Window switching.
  # ---------------------------------------------------------------------------
  - id: window_go
    mode: restart
    parameters:
      target: int
    then:
      - lambda: |-
          if (target < 0 || target > 4) return;
          if (id(art_fading)) {
            id(window_queued) = target;
            return;
          }
          id(window_queued) = -1;
          id(window_index) = target;
          if (target == 3) id(setup_page) = 3;
          if (target == 4) id(setup_page) = 4;

          // Close any open on-screen keyboard when navigating between screens.
          id(keyboard_target) = -1;
          wifi_keyboard_toggle->execute();

          lv_obj_add_flag(id(boot_overlay), LV_OBJ_FLAG_HIDDEN);

          lv_obj_t *wins[5] = {
            id(window_0),
            id(window_1),
            id(window_2),
            id(setup_wifi_screen),
            id(setup_bind_screen),
          };
          for (int i = 0; i < 5; i++) {
            lv_obj_set_x(wins[i], 0);
            if (i == target) {
              lv_obj_clear_flag(wins[i], LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(wins[i], LV_OBJ_FLAG_HIDDEN);
            }
            lv_obj_invalidate(wins[i]);
          }
          window_draw_rail->execute();

  - id: window_prev
    mode: single
    then:
      - if:
          condition:
            lambda: return id(window_index) > 0 && id(window_index) <= 2;
          then:
            - script.execute: { id: window_go, target: (int)id(window_index) - 1 }

  - id: window_next
    mode: single
    then:
      - if:
          condition:
            lambda: return id(window_index) < 2;
          then:
            - script.execute: { id: window_go, target: (int)id(window_index) + 1 }

  - id: window_tick
    mode: restart
    then:
      - if:
          condition:
            lambda: return id(window_queued) >= 0 && !id(art_fading);
          then:
            - script.execute: { id: window_go, target: (int)id(window_queued) }

