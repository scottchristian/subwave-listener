# The screens' own scripts and state, separated from their widgets.
#
# These were the `script:` and `globals:` blocks that sat beside each screen's
#
# widget tree. Once a screen file became a bare list of widgets — because a
#
# widget's parent is now the `widgets:` list it sits in, and only the enclosing
#
# file can supply that — those blocks had nowhere to live.
#
# They are together rather than split back across the screens because a package
#
# file may declare each top-level key exactly once, and two files both wanting
#
# `script:` is only a problem once they are merged into one.
#
#

globals:
  - id: idle_deadline_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: screen_asleep
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: keyboard_target
    type: int
    restore_value: no
    initial_value: '0'


script:
  - id: set_brightness_to
    mode: restart
    parameters:
      value: int
    then:
      - lambda: |-
          auto *c = id(display_client);
          c->settings_draft().brightness = value;
          auto draft = c->settings_draft();
          c->push_settings(draft);
          subwave_display::settings_refresh();
          float v = (float) value / 100.0f;
          auto *light = id(backlight);
          auto call = light->make_call();
          call.set_brightness(v);
          call.set_transition_length(800);
          call.perform();

  - id: theme_cycle
    mode: single
    then:
      - lambda: |-
          auto *c = id(display_client);
          std::string m = c->settings().theme_mode;
          m = (m == "auto") ? "day" : (m == "day") ? "night" : "auto";
          c->settings_draft().theme_mode = m;
          auto draft = c->settings_draft();
          c->push_settings(draft);
          subwave_display::settings_refresh();

  - id: idle_cycle
    mode: single
    then:
      - lambda: |-
          auto *c = id(display_client);
          std::string m = c->settings().idle_mode;
          m = (m == "stay") ? "dim" : (m == "dim") ? "off" : "stay";
          c->settings_draft().idle_mode = m;
          auto draft = c->settings_draft();
          c->push_settings(draft);
          subwave_display::settings_refresh();

  - id: orientation_cycle
    mode: single
    then:
      # REBOOTS. `display_rotation` is compile-time on this panel and there is no
      # clean runtime path, so the setting applies and the screen restarts. The
      # label says so, because a screen that silently restarts looks broken.
      - lambda: |-
          auto *c = id(display_client);
          c->settings_draft().orientation =
              (c->settings().orientation == "landscape") ? "portrait" : "landscape";
          auto draft = c->settings_draft();
          c->push_settings(draft);
          subwave_display::settings_refresh();
          ESP_LOGW("subwave.settings", "Orientation changed; the screen restarts to turn on its side.");
          App.safe_reboot();

  - id: skip_toggle
    mode: single
    then:
      - lambda: |-
          auto *c = id(display_client);
          c->settings_draft().skip_enabled = !c->settings().skip_enabled;
          auto draft = c->settings_draft();
          c->push_settings(draft);
          subwave_display::settings_refresh();

  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # WHY THE CALLS IN THIS FILE LOOK MIXED.
  #
  # ESPHome 2026.7 wraps a widget in a typed C++ class (`LvDropdownType`,
  # `LvPageType`) ONLY for the handful of widget kinds that expose a typed API —
  # two of them in this build. Every other widget — every label, every obj, the
  # textarea — is emitted as a bare `lv_obj_t *`, and `lv_obj_t` is only ever
  # forward-declared before a lambda, so it is an INCOMPLETE TYPE there.
  #
  # That has exactly two consequences, and this file obeys both:
  #
  #   - `id(wifi_status).set_text(...)` cannot compile. Calling a member on a
  #     pointer to an incomplete type requires the complete type.
  #   - `id(window_0)->obj` cannot compile, for the same reason. There is no
  #     `.obj` member — `id(window_0)` IS the pointer.
  #
  # So: raw widgets are driven through the LVGL C API, which takes `lv_obj_t *`
  # BY VALUE and never dereferences it at the call site. And the dropdown, which
  # does have a real class, is driven through it. `->obj` appears only on typed
  # widgets, and a bare `id(x)` only where a raw pointer is wanted.
  #
  # An array of pointers to an incomplete type is fine, so indexing `wins[]`
  # below is legal.
  # ---------------------------------------------------------------------------
  # On-screen WiFi setup — scan, pick, connect.
  #
  # The WiFi credentials can also be set from a phone that has joined the
  # SUBWAVE-SCREEN access point; the captive portal serves the wizard with no URL
  # to type. The on-screen path is the fallback for when no phone is to hand:
  # scan for networks, pick one, enter a password, connect.
  - id: wifi_scan
    mode: single
    then:
      - lambda: |-
          id(setup_web)->request_scan();
          lv_label_set_text(id(wifi_status), "Scanning…");

  # Start a scan at boot, and watch it land.
  #
  # A list that only exists on glass cannot be debugged with a serial cable and
  # no display — which is exactly the situation when a scan returns nothing. The
  # per-network log lives in subwave_setup_web's scan listener, which fires at
  # the one moment the results are valid. This script starts the scan and then
  # reports whether it landed.
  #
  # WHY THERE IS NO WAIT BEFORE READING. An earlier version slept 10s and then
  # read get_scan_result(), which reports zero results on a scan that is merely
  # still running. ESPHome's own scan timeout is 31s, so a 10s read was reporting
  # "nothing there" for two thirds of the time a scan is allowed to take. The
  # screen now asks subwave_setup_web whether a scan has actually landed.
  - id: wifi_scan_log
    mode: restart
    then:
      - delay: 4s
      - lambda: |-
          ESP_LOGI("subwave.setup", "Starting a WiFi scan for the on-screen list.");
          id(setup_web)->request_scan();
      # Poll rather than sleep once, so the log says WHICH of three very
      # different situations this is: the scan never started, it started and
      # heard nothing, or it heard plenty and the completion event never
      # reached ESPHome. Only the third is a lost event; the first two are the
      # radio's own answer and should not be reported as a fault. The poll goes
      # quiet on its own once a scan lands.
      - repeat:
          count: 20
          then:
            - delay: 2s
            - lambda: |-
                id(setup_web)->log_radio_state();
      - lambda: |-
          // Only reached if no scan landed. If one did, the listener in
          // subwave_setup_web already logged every network it heard.
          ESP_LOGW("subwave.setup", "No scan result after 40s. A scan that reports nothing "
                                   "and a scan that never finished look identical from here.");
          wifi_populate_dropdown->execute();

  # Fill the picker.
  #
  # MESH NETWORKS REPORT THE SAME SSID FROM EVERY RADIO IN THE MESH, so a naive
  # pass fills the dropdown with four copies of "home_automation" and the picker
  # becomes unusable — and worse, the copies are in radio-discovery order, so the
  # signal a phone would actually get from the one it picks is not the signal
  # shown. So: dedupe by SSID, keep the strongest RSSI, then sort strongest
  # first. One entry per network, and the top entry is the one to pick.
  - id: wifi_populate_dropdown
    mode: single
    then:
      - lambda: |-
          if (!id(setup_web)->scan_completed()) {
            // Still scanning. Saying so is the whole point: an empty dropdown
            // with no explanation is indistinguishable from a dead radio, and
            // on a wall screen nobody is going to work that out.
            lv_label_set_text(id(wifi_status), "Still scanning for networks...");
            return;
          }

          // SSID -> strongest RSSI seen, so a later, weaker beacon for a network
          // already recorded cannot drag its entry down the list.
          std::map<std::string, int> best;
          auto &results = wifi::global_wifi_component->get_scan_result();
          for (auto &scan : results) {
            if (scan.get_is_hidden())
              continue;
            std::string ssid{scan.get_ssid().c_str()};
            if (ssid.empty())
              continue;
            int rssi = scan.get_rssi();
            auto it = best.find(ssid);
            if (it == best.end() || rssi > it->second)
              best[ssid] = rssi;
          }

          // Strongest first. A stable tiebreak on the SSID keeps the order from
          // shifting between two scans that report the same networks equally
          // well, which would otherwise move someone's entry under their finger.
          std::vector<std::pair<int, std::string>> sorted;
          sorted.reserve(best.size());
          for (auto &kv : best)
            sorted.emplace_back(kv.second, kv.first);
          std::sort(sorted.begin(), sorted.end(),
                    [](const std::pair<int, std::string> &a, const std::pair<int, std::string> &b) {
                      if (a.first != b.first) return a.first > b.first;
                      return a.second < b.second;
                    });

          std::vector<std::string> options;
          options.reserve(sorted.size());
          for (auto &entry : sorted)
            options.push_back(entry.second);

          ESP_LOGI("subwave.setup", "%u result(s) collapsed to %u network(s).",
                   (unsigned) results.size(), (unsigned) options.size());
          if (options.empty())
            options.push_back("No networks found");

          id(wifi_network_dropdown)->set_options(options);
          lv_label_set_text(id(wifi_status), options.size() == 1 && options[0] == "No networks found"
                                              ? "No networks found."
                                              : "Pick a network below.");

  # ---------------------------------------------------------------------------
  # The on-screen keyboard.
  #
  # Tapping the password field opens it; tapping the field again, or Done, closes
  # it. Nothing else on the screen opens it, because there is nothing else that
  # needs it.
  #
  # NOTHING MOVES WHEN IT OPENS. The keyboard sits UNDER the password field, so
  # opening it only changes which widgets are visible. An earlier version raised
  # the field into the row above the keyboard, which needed the field's caption,
  # the Connect button and two hidden controls all to move together — and they
  # collided twice anyway. Neither collision was detectable by an assertion:
  # every widget was still inside the panel and nothing overlapped anything
  # still visible. They were found by drawing the screen (npm run render:setup),
  # which is the argument for drawing it.
  # ---------------------------------------------------------------------------
  # Test the server connection. Normalises the URL (adds https:// if no scheme)
  # and checks DNS + TCP. If it works, the bind code field is ready to use.
  - id: bind_test_connection
    mode: single
    then:
      - lambda: |-
          const char *raw = lv_textarea_get_text(id(bind_server_url));
          std::string url = raw ? raw : "";
          // Trim
          while (!url.empty() && (url.front() == ' ' || url.front() == '\t')) url.erase(url.begin());
          while (!url.empty() && (url.back() == ' ' || url.back() == '\t' || url.back() == '/')) url.pop_back();
          if (url.empty()) {
            lv_label_set_text(id(bind_status), "Enter a server address first.");
            return;
          }
          // Add scheme if missing
          if (url.find("://") == std::string::npos) {
            url = "https://" + url;
            lv_textarea_set_text(id(bind_server_url), url.c_str());
          }
          // Store for the bind step
          id(display_client)->set_server_url(url);
          auto *c = id(display_client);
          c->set_server_url(url);

          // Test connectivity
          lv_label_set_text(id(bind_status), "Testing connection...");
          auto result = c->check_connectivity();
          if (result == subwave_display::SubwaveDisplay::Connectivity::OK ||
              result == subwave_display::SubwaveDisplay::Connectivity::NO_SERVER) {
            // NO_SERVER means DNS resolved but the host didn't answer on the port.
            // For an unbound device, the bind endpoint might be on a different
            // path. Report what we found.
            if (result == subwave_display::SubwaveDisplay::Connectivity::OK) {
              lv_label_set_text(id(bind_status), "Connected. Enter the bind code and tap Bind.");
            } else {
              lv_label_set_text(id(bind_status), "Server not responding. Check the address.");
            }
          } else {
            const char *msg = c->connectivity_message(result);
            lv_label_set_text(id(bind_status), msg);
          }

  # Bind the device to the station. Uses the server URL and bind code from the
  # on-screen fields. On success, stores identity in flash and reboots.
  - id: bind_device
    mode: single
    then:
      - lambda: |-
          const char *url_raw = lv_textarea_get_text(id(bind_server_url));
          const char *code_raw = lv_textarea_get_text(id(bind_code));
          std::string url = url_raw ? url_raw : "";
          std::string code = code_raw ? code_raw : "";
          if (url.empty() || code.empty()) {
            lv_label_set_text(id(bind_status), "Enter both the server address and bind code.");
            return;
          }
          if (url.find("://") == std::string::npos) {
            url = "https://" + url;
          }
          lv_label_set_text(id(bind_status), "Binding...");
          auto *c = id(display_client);
          c->set_server_url(url);
          c->set_bind_code(code);
          if (c->bind(url, code)) {
            lv_label_set_text(id(bind_status), "Bound! Rebooting...");
            // Reboot to pick up the new identity
            App.safe_reboot();
          } else {
            lv_label_set_text(id(bind_status), "Bind failed. Check the code and try again.");
          }

  - id: wifi_keyboard_toggle
    mode: single
    then:
      - lambda: |-
          auto *kb = id(wifi_keyboard)->obj;
          bool opening = lv_obj_has_flag(kb, LV_OBJ_FLAG_HIDDEN);

          // NOTHING MOVES. THIS IS THE SECOND TIME, AND THE FIRST TIME LOST.
          //
          // The first version raised the password field into the row above the
          // keyboard. That needed three things to go right at once: the field's
          // caption travelled with it, the Connect button travelled with it, and
          // the two controls the field landed on were hidden. All three were
          // implemented and all three were still wrong — the caption landed on
          // the section heading, and two of the four character-set buttons
          // landed underneath Connect.
          //
          // NEITHER COLLISION IS DETECTABLE BY AN ASSERTION. Every widget was
          // still inside the panel; nothing overlapped anything still visible.
          // They were found by drawing the screen, which is the whole argument
          // for drawing it.
          //
          // A 1200x180 keyboard tucked UNDER the password field does the same
          // job with none of that: nothing is raised, nothing travels, nothing
          // is covered, and no caption can end up above its own box.
          //
          // What is hidden is the two things that act on a FINISHED password —
          // Connect and the status line. Both share the field's row, which is
          // where the character-set buttons go while typing.
          //
          // The type is spelled out rather than `auto`, and not because the two
          // differ — they are both `lv_obj_t *`. It is that `auto *row[] = {...}`
          // cannot deduce from a braced-init-list at all, and the error it
          // produces names a dozen inherited class paths and never mentions a
          // braced list. Declaring `lv_obj_t *` is fine even though the type is
          // incomplete: a pointer to an incomplete type may be declared, just
          // not dereferenced.
          lv_obj_t *hidden_while_typing[] = {id(setup_connect_button), id(wifi_status)};
          lv_obj_t *shown_while_typing[] = {id(wifi_mode_lower), id(wifi_mode_upper), id(wifi_mode_special),
                                   id(wifi_mode_number), id(wifi_keyboard_done)};

          if (opening) {
            // Switch the keyboard's target based on keyboard_target.
            // 0 = wifi_password (default), 1 = (unused), 2 = bind_server_url, 3 = bind_code
            lv_obj_t *target = id(wifi_password);
            if (id(keyboard_target) == 2) target = id(bind_server_url);
            else if (id(keyboard_target) == 3) target = id(bind_code);
            lv_keyboard_set_textarea(kb, target);

            lv_obj_clear_flag(kb, LV_OBJ_FLAG_HIDDEN);
            for (auto *o : hidden_while_typing)
              lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
            for (auto *o : shown_while_typing)
              lv_obj_clear_flag(o, LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(kb, LV_OBJ_FLAG_HIDDEN);
            for (auto *o : hidden_while_typing)
              lv_obj_clear_flag(o, LV_OBJ_FLAG_HIDDEN);
            for (auto *o : shown_while_typing)
              lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
          }
          lv_obj_invalidate(kb);

  # Switch the keyboard's character set.
  #
  # LVGL's keyboard shows exactly one set at a time and does not cycle, so a
  # password containing a digit and a lowercase letter needs this. The parameter
  # indexes the mode rather than naming it because ESPHome's script parameters
  # are typed, and the alternative — four near-identical scripts — is worse.
  - id: wifi_keyboard_mode
    mode: restart
    parameters:
      mode: int
    then:
      - lambda: |-
          static const lv_keyboard_mode_t modes[4] = {
              LV_KEYBOARD_MODE_TEXT_LOWER,
              LV_KEYBOARD_MODE_TEXT_UPPER,
              LV_KEYBOARD_MODE_SPECIAL,
              LV_KEYBOARD_MODE_NUMBER,
          };
          if (mode < 0 || mode > 3)
            return;
          lv_keyboard_set_mode(id(wifi_keyboard)->obj, modes[mode]);

  # Run when a scan actually lands.
  #
  # The trigger has to be the real event, not a timer. The on-screen list is the
  # only place someone standing at the wall can see the result, so it has to be
  # right at the moment it is looked at; a list filled on a schedule is either
  # empty on arrival or stale.
  #
  # NOT NAMED `on_wifi_scan_results`: ESPHome's id namespace is global, and using
  # the same string as both the script id and the `on_scan_script:` option value
  # makes the validator report the id as defined twice.
  - id: wifi_scan_landed
    mode: restart
    then:
      - script.execute: wifi_populate_dropdown

  - id: wifi_connect
    mode: single
    then:
      - lambda: |-
          std::string ssid = id(wifi_network_dropdown)->get_selected_text();
          const char *psk = lv_textarea_get_text(id(wifi_password));
          if (ssid.empty() || ssid == "No networks found") {
            lv_label_set_text(id(wifi_status), "No network selected.");
            return;
          }
          if (psk == nullptr)
            psk = "";
          lv_label_set_text(id(wifi_status), ("Connecting to " + ssid + "...").c_str());

          // NO REBOOT ON THE HAPPY PATH. This is what the button used to do, and
          // it was wrong in the way a wall-mounted screen makes wrong things
          // obvious: tapping Connect blanked the panel for four seconds and came
          // back — including on every FAILED attempt, which is exactly when
          // somebody is standing in front of it wondering what they did.
          //
          // The reboot was never necessary. save_wifi_sta already does both jobs
          // that matter: it writes the credentials to flash (pref_.save followed
          // by global_preferences->sync) and it registers them with the runtime
          // network list via set_sta(). All that is left is to start the
          // association, and retry_connect() does that through
          // start_connecting(), which moves the state machine to
          // STA_CONNECTING and begins associating on the next loop.
          //
          // retry_connect() is called explicitly because save_wifi_sta's own
          // connect_soon() only fires from COOLDOWN, and this device sits in
          // WIFI_COMPONENT_STATE_AP — no configured station network, because it
          // has not been provisioned yet. From AP it is a no-op, which is the
          // same reason the original code rebooted instead of connecting.
          auto *wifi = wifi::global_wifi_component;
          wifi->save_wifi_sta(ssid, psk);
          wifi->retry_connect();
          wifi_connect_watchdog->execute();

  # The failure path, and why a reboot is still the right answer THERE.
  #
  # THE ACCESS POINT CANNOT COME BACK BY ITSELF. WiFiComponent::loop() restarts
  # the fallback access point under `if (this->has_ap() && !this->ap_setup_)` —
  # but ap_setup_ is assigned exactly once in the entire component, in
  # setup_ap_config_(), and is never cleared: not on WIFI_EVENT_AP_STOP, not
  # anywhere else. So that branch can never be true again after first setup, and
  # the 90-second ap_timeout fallback is unreachable on this build.
  #
  # That matters because starting a connection DROPS the access point:
  # wifi_sta_connect_ calls wifi_mode_(true, {}), which is STA-only. A wrong
  # password therefore leaves the screen with no network AND no access point,
  # retrying in silence, until somebody physically power-cycles a panel bolted to
  # a wall.
  #
  # A reboot is not a workaround here; it IS the recovery. At boot,
  # setup_wifi_ap() starts the access point unconditionally and only declines to
  # leave the AP state when no station network is configured — so restarting puts
  # the wizard back exactly where it was, with the bad credentials still on flash
  # for the person to correct from the screen or the wizard.
  #
  # 45 seconds is longer than a healthy association takes on any ordinary network
  # and short enough that somebody watching the screen sees it resolve one way or
  # the other rather than standing in front of it.
  - id: wifi_connect_watchdog
    mode: restart
    then:
      - delay: 45s
      - lambda: |-
          if (wifi::global_wifi_component->is_connected())
            return;
          ESP_LOGW("subwave.setup",
                   "No association after 45s. Restarting so the setup access point comes back.");
          lv_label_set_text(id(wifi_status), "Could not join that network. Restarting...");
          delay(1500);
          App.safe_reboot();

  # ---------------------------------------------------------------------------
  # The connectivity ladder, run ONCE at boot.
  #
  # THE POINT OF THIS SCRIPT IS THAT IT CAN DO NOTHING. A screen whose WiFi works
  # comes up, checks, finds nothing wrong, and goes about its business. Setup is
  # demanded only when a step actually fails — which is the whole reason the
  # ladder exists rather than a single "is it connected" boolean.
  #
  # WHY IT RUNS ONCE. Re-running it means a cafe router that stops routing at 4pm
  # turns a wall screen into a Wi-Fi prompt with no warning, for a problem the
  # person standing there cannot fix. The station's own error state is the right
  # thing to show when the network drops mid-session, and the person who CAN fix
  # it should be the one who chose the network — which is what the Settings row
  # is for.
  #
  # WHY 18 SECONDS. Long enough for an association to have settled and for the
  # server to have answered at least one heartbeat, so step four has something to
  # judge. Short enough that nobody notices they were waiting. The ladder blocks
  # for a few seconds itself; that is a script action, not the main loop.
  #
  # The quiet line on the now-playing window says what is being checked while
  # this runs, so the screen is doing something legible rather than sitting blank.
  # ---------------------------------------------------------------------------
  - id: check_connectivity
    mode: single
    then:
      - delay: 18s
      - lambda: |-
          auto *c = id(display_client);
          auto result = c->check_connectivity();
          const char *message = c->connectivity_message(result);

          if (result == subwave_display::SubwaveDisplay::Connectivity::OK && !id(display_client)->needs_bind()) {
            lv_label_set_text(id(status_line), "");
            ESP_LOGI("subwave.setup", "Network is fine. Not asking for setup.");
            return;
          }

          // Unbound device: the network is fine but the screen has no identity.
          // Show the setup screen so the operator can enter the server URL and
          // bind code.
          if (id(display_client)->needs_bind()) {
            ESP_LOGI("subwave.setup", "Unbound device. Showing setup.");
            lv_label_set_text(id(status_line), "");
            window_go->execute(3);
            return;
          }

          // NO_SERVER is the one failure that setup cannot fix. The network is
          // fine and the station is not answering — a server address problem, and
          // the address is not editable from a wall screen. Showing a Wi-Fi picker
          // would send somebody to re-enter a password that was never wrong.
          //
          // So this branch says what is wrong on the main window and stops. It is
          // not "setup is needed", and logging that was the first version's
          // mistake: the log then claimed a Wi-Fi prompt was on its way when none
          // was, which is the kind of thing that sends you looking for a bug that
          // is not there.
          if (result == subwave_display::SubwaveDisplay::Connectivity::NO_SERVER) {
            lv_label_set_text(id(status_line), message);
            ESP_LOGW("subwave.setup", "Staying on the main screen. %s", message);
            return;
          }

          ESP_LOGW("subwave.setup", "Setup IS needed: %s", message);
          lv_label_set_text(id(status_line), "");
          window_go->execute(3);

  # ---------------------------------------------------------------------------
  # Skip — the only control on the now-playing window.
  #
  # IT DID NOTHING. The button was drawn, the label had all four states wired to
  # it, SubwaveDisplay::request_skip() was implemented and correct, and the button
  # had no on_click at all. It was the single most visible affordance on the
  # screen and it was inert. Nothing said so anywhere: the log was silent because
  # there was no request to log, and the dead-code gate that would have found it
  # did not exist yet.
  #
  # WHY THE LABEL IS NOT SET HERE. device/design.md is explicit that the device
  # receives a finished label and never interprets a mode, and that is what stops
  # the wall and a browser disagreeing about whether a skip worked. Inventing a
  # local "Skipping…" would be exactly the disagreement the rule exists to
  # prevent — and if the server refuses the skip, the screen would have to take
  # the word back.
  #
  # SO: fire the request and go straight back to the server for the truth. The
  # normal poll is up to ten seconds away, and a press with ten seconds of
  # nothing after it does not read as a slow network — it reads as a dead button,
  # which is what the button already was.
  # ---------------------------------------------------------------------------
  - id: skip_press
    mode: single
    then:
      - lambda: |-
          auto *c = id(display_client);
          c->request_skip();
          c->refresh_now();

  # ---------------------------------------------------------------------------
  # Idle: arm, tick, wake.
  #
  # ALL THREE PARTS WERE MISSING until 1.9.0. idle_apply() was called only from
  # idle_touch(), and idle_touch() was called from nothing — so the screen never
  # dimmed, never blanked, and had no way to wake, while the settings screen
  # offered three working-looking idle modes. The globals were declared and bound.
  # Nothing read them.
  #
  # A TICK, NOT A TIMER. The deadline is armed by a touch and re-armed by every
  # wake, so a self-rescheduling timer would have to be cancelled and rebuilt
  # each time and would eventually be the one that leaks. Asking a question on an
  # interval cannot leave a timer behind.
  #
  # FIVE SECONDS, not one. The modes are measured in minutes; the only cost of a
  # coarser tick is that the screen goes off up to five seconds late, which is
  # invisible, and waking is immediate because it is driven by the touch itself.
  - id: idle_tick
    mode: single
    then:
      - lambda: subwave_display::idle_poll();

  # Arm the deadline. Called at boot and again on every wake.
  - id: idle_arm
    mode: single
    then:
      - lambda: subwave_display::idle_touch();

  # ---------------------------------------------------------------------------
  # What is on the glass at boot.
  #
  # EVERY SLOT IN window_stack IS CREATED VISIBLE. window_0, window_1,
  # window_2 and setup_screen all sit at x=0, y=0 with no `hidden:` flag in
  # display.yaml, so they stack, and the one created LAST draws on top.
  #
  # setup_screen is last in the list. So out of the box the setup screen covers
  # the now-playing screen on every single boot, and a screen with working WiFi
  # shows a Wi-Fi prompt to somebody who does not need one.
  #
  # THIS IS WHY IT SURVIVED THE CONNECTIVITY LADDER BEING CORRECT. The ladder
  # logs "all four steps pass. Not asking for setup" and it is telling the
  # truth — it did not navigate anywhere. The setup screen was simply already on
  # top, and nothing in the boot log says what is being drawn.
  #
  # A lesson worth keeping: a log that reports what a component DID is not
  # evidence about what is on the glass. Only the glass answers that.
  #
  # The initial state is set explicitly here rather than inferred from which
  # window happens to be created last. window_go maintains it from then on.
  # ---------------------------------------------------------------------------
  - id: boot_windows
    mode: single
    then:
      - lambda: |-
          lv_obj_add_flag(id(window_1), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(window_2), LV_OBJ_FLAG_HIDDEN);
          // An unbound device has no identity and no server URL. Show the setup
          // screen so the operator can enter the server address and bind code.
          // A bound device shows the now-playing window.
          auto *c = id(display_client);
          bool bound = !c->device_id().empty() && !c->claim_token().empty() && !c->server_url().empty();
          if (bound) {
            lv_obj_add_flag(id(setup_screen), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(window_0), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_x(id(window_0), 0);
            ESP_LOGI("subwave.ui", "Boot window is 0; the other three slots hidden.");
          } else {
            lv_obj_clear_flag(id(setup_screen), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(window_0), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_x(id(setup_screen), 0);
            ESP_LOGI("subwave.ui", "Unbound device. Boot window is setup.");
          }
          window_draw_rail->execute();

  # ---------------------------------------------------------------------------
  # Window switching (moved from window.yaml to avoid duplicate script: key).
  #
  # Four slots live side by side inside window_stack: window_0, window_1,
  # window_2, setup_screen. Exactly one is visible; the rest are parked off to
  # one side behind LV_OBJ_FLAG_HIDDEN. A slide is a loop that walks both the
  # outgoing and incoming slot across the stack a few pixels at a time.
  #
  # THE ANIMATION IS PLAIN LVGL, NOT lv_anim. The crossfade in theme.yaml already
  # blocks this script through art_fading, and adding a second, independent
  # animation system here would mean two clocks driving one window — which is
  # how a slide ends up fighting a crossfade and leaving the screen blank.
  # ---------------------------------------------------------------------------
  - id: window_go
    mode: restart
    parameters:
      target: int
    then:
      - lambda: |-
          if (target == id(window_index)) return;
          // A slide requested mid-crossfade is remembered, not dropped: the
          // crossfade clears art_fading and window_tick picks this up.
          if (id(art_fading)) {
            id(window_queued) = target;
            return;
          }
          id(window_queued) = -1;
          int from = id(window_index);
          id(window_index) = target;

          // Pointers to an incomplete type — legal to hold, illegal to deref.
          lv_obj_t *wins[4] = {id(window_0), id(window_1), id(window_2), id(setup_screen)};

          const int32_t width = 800;   // the panel is 800x800
          const int32_t step = 24;     // 800/24 = 34 frames, ~570ms at 16ms
          int32_t direction = target > from ? 1 : -1;

          for (int32_t moved = 0; moved < width; moved += step) {
            for (int32_t f = 0; f <= moved; f += step)
              lv_obj_set_x(wins[from], direction > 0 ? -f : width - f);
            for (int32_t f = width - moved; f >= 0; f -= step)
              lv_obj_set_x(wins[target], direction > 0 ? f : width - f);
            delay(16);
          }

          lv_obj_set_x(wins[from], direction > 0 ? -width : width);
          lv_obj_set_x(wins[target], 0);
          lv_obj_add_flag(wins[from], LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(wins[target], LV_OBJ_FLAG_HIDDEN);
          lv_obj_invalidate(wins[from]);
          lv_obj_invalidate(wins[target]);
          window_draw_rail->execute();

  - id: window_prev
    mode: single
    then:
      - if:
          condition:
            lambda: return id(window_index) > 0;
          then:
            - script.execute: { id: window_go, target: (int)id(window_index) - 1 }

  - id: window_next
    mode: single
    then:
      - if:
          condition:
            lambda: return id(window_index) < 3;
          then:
            - script.execute: { id: window_go, target: (int)id(window_index) + 1 }

  - id: window_tick
    mode: restart
    then:
      - if:
          condition:
            lambda: return id(window_queued) >= 0 && !id(art_fading);
          then:
            - script.execute: { id: window_go, target: (int)id(window_index) + 1 }
