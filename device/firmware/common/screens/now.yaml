# Window 1 of 3 — Now Playing.
#
# Three tiers read top to bottom:
#   1. Who is on air (live lamp, presenter, show title, time remaining)
#   2. What is playing (large serif track title, artist, 520x520 cover art well)
#   3. Station activity (listener counts, skip track control, status line)

# ---- Tier 1: On-Air Voice & Show -----------------------------
- obj:
    id: live_lamp
    width: 14px
    height: 14px
    radius: 7px
    align: TOP_LEFT
    x: 64px
    y: 72px
    bg_color: 0x4E9FD4
    bg_opa: COVER
    border_width: 0

- label:
    id: byline_presenter
    text: "SUB/WAVE RADIO"
    text_font: font_body
    text_color: 0xDCE8F5
    align: TOP_LEFT
    x: 90px
    y: 64px
    width: 566px

- label:
    id: byline_show
    text: "24/7 Live Broadcast"
    text_font: font_body
    text_color: 0x4E9FD4
    align: TOP_LEFT
    x: 90px
    y: 100px
    width: 566px

- label:
    id: byline_runway
    text: "ON AIR"
    text_font: font_small
    text_color: 0x6A8BA8
    align: TOP_LEFT
    x: 90px
    y: 138px
    width: 566px

# ---- Framed Artwork Well & Double-Buffered Cover Images ------
# `art_well` sits behind `art_out` and `art_in` at (696, 64, 520x520) via
# TOP_RIGHT (-64px) so the right half of the screen has a crisp vinyl sleeve
# frame before cover art finishes loading or while the stream is idle.
- obj:
    id: art_well
    width: 520px
    height: 520px
    radius: 12px
    align: TOP_RIGHT
    x: -64px
    y: 64px
    bg_color: 0x0A182B
    bg_opa: COVER
    border_width: 2
    border_color: 0x1A3050
    border_opa: COVER
    pad_all: 0
    scrollable: false
    clickable: false
    widgets:
      - label:
          id: art_well_title
          text: "SUB/WAVE"
          text_font: font_title
          text_color: 0x294A6E
          align: CENTER
          y: -16px
      - label:
          id: art_well_sub
          text: "STATION BROADCAST DISPLAY"
          text_font: font_small
          text_color: 0x1E3856
          align: CENTER
          y: 28px

- image:
    id: art_out
    src: art_out_image
    width: 520px
    height: 520px
    align: TOP_LEFT
    x: 696px
    y: 64px
    bg_color: 0x0D1F35
    bg_opa: COVER
    clickable: false
    hidden: true

- image:
    id: art_in
    src: art_in_image
    width: 520px
    height: 520px
    align: TOP_LEFT
    x: 696px
    y: 64px
    bg_color: 0x0D1F35
    bg_opa: COVER
    clickable: false
    hidden: true

# ---- Tier 2: Current Track -----------------------------------
- label:
    id: track_title
    text: "Tuning In…"
    text_font: font_title
    text_color: 0xDCE8F5
    align: TOP_LEFT
    x: 64px
    y: 200px
    width: 592px
    long_mode: DOT
    text_line_space: 2

- label:
    id: track_artist
    text: "Waiting for live station metadata"
    text_font: font_body
    text_color: 0x8FB4D4
    align: TOP_LEFT
    x: 64px
    y: 324px
    width: 592px
    long_mode: DOT

# ---- Tier 3: Station Presence & Controls ---------------------
- obj:
    id: now_rule
    width: 592px
    height: 2px
    align: TOP_LEFT
    x: 64px
    y: 388px
    bg_color: 0x1A3050
    bg_opa: COVER
    border_width: 0

- label:
    id: count_signed_in
    text: "0"
    text_font: font_title
    text_color: 0xDCE8F5
    align: TOP_LEFT
    x: 64px
    y: 414px
    width: 280px

- label:
    id: count_signed_label
    text: "SIGNED IN"
    text_font: font_small
    text_color: 0x6A8BA8
    align: TOP_LEFT
    x: 64px
    y: 472px
    width: 280px

- label:
    id: count_listening
    text: "0"
    text_font: font_title
    text_color: 0xDCE8F5
    align: TOP_LEFT
    x: 376px
    y: 414px
    width: 280px

- label:
    id: count_listening_label
    text: "LISTENING NOW"
    text_font: font_small
    text_color: 0x6A8BA8
    align: TOP_LEFT
    x: 376px
    y: 472px
    width: 280px

# ---- Skip Control --------------------------------------------
- button:
    id: btn_skip
    width: 280px
    height: 68px
    radius: 34px
    align: TOP_LEFT
    x: 64px
    y: 536px
    bg_color: 0x241219
    bg_opa: COVER
    border_width: 2
    border_color: 0xEF4444
    border_opa: COVER
    checkable: false
    on_click:
      - script.execute: skip_press
    widgets:
      - label:
          id: btn_skip_label
          text: "Skip track"
          text_font: font_body
          text_color: 0xF8FAFC
          align: CENTER

# ---- Status Line ---------------------------------------------
- label:
    id: status_line
    text: ""
    text_font: font_small
    text_color: 0x6A8BA8
    align: TOP_LEFT
    x: 64px
    y: 636px
    width: 1152px
