# Window 3 of 3 — Device Settings & Diagnostics.
#
# Discrete touch rows with explicit y coordinates (no overlapping at y=0)
# and read-only network/hardware telemetry below the divider.

- label:
    id: settings_title
    text: "DEVICE SETTINGS"
    text_font: font_body
    text_color: 0xDCE8F5
    align: TOP_LEFT
    x: 64px
    y: 36px
    width: 700px

- label:
    id: settings_clock
    text: "00:00"
    text_font: font_body
    text_color: 0x6A8BA8
    align: TOP_RIGHT
    x: -64px
    y: 36px
    width: 300px

- obj:
    id: settings_body
    width: 1152px
    height: 616px
    align: TOP_LEFT
    x: 64px
    y: 88px
    bg_opa: TRANSP
    border_width: 0
    pad_all: 0
    scrollable: false
    widgets:
      # ---- Row 1: Brightness (10 discrete segments) ----------
      - obj:
          id: set_brightness
          x: 0px
          y: 0px
          width: 1152px
          height: 56px
          radius: 8px
          bg_color: 0x0A182B
          bg_opa: COVER
          border_width: 0
          pad_all: 0
          scrollable: false
          widgets:
            - label: { id: lbl_brightness, text: "Brightness", text_font: font_body, text_color: 0xDCE8F5, align: LEFT_MID, x: 20px, width: 280px }
            - obj:
                id: brightness_segments
                width: 640px
                height: 36px
                align: RIGHT_MID
                x: -116px
                bg_opa: TRANSP
                border_width: 0
                pad_all: 0
                scrollable: false
                widgets:
                  - obj: { id: seg_0, width: 56px, height: 36px, radius: 4px, x: 0px,   bg_color: 0x4E9FD4, bg_opa: COVER, border_width: 0, clickable: true, on_click: { script.execute: { id: set_brightness_to, value: 10 } } }
                  - obj: { id: seg_1, width: 56px, height: 36px, radius: 4px, x: 64px,  bg_color: 0x4E9FD4, bg_opa: COVER, border_width: 0, clickable: true, on_click: { script.execute: { id: set_brightness_to, value: 20 } } }
                  - obj: { id: seg_2, width: 56px, height: 36px, radius: 4px, x: 128px, bg_color: 0x4E9FD4, bg_opa: COVER, border_width: 0, clickable: true, on_click: { script.execute: { id: set_brightness_to, value: 30 } } }
                  - obj: { id: seg_3, width: 56px, height: 36px, radius: 4px, x: 192px, bg_color: 0x4E9FD4, bg_opa: COVER, border_width: 0, clickable: true, on_click: { script.execute: { id: set_brightness_to, value: 40 } } }
                  - obj: { id: seg_4, width: 56px, height: 36px, radius: 4px, x: 256px, bg_color: 0x4E9FD4, bg_opa: COVER, border_width: 0, clickable: true, on_click: { script.execute: { id: set_brightness_to, value: 50 } } }
                  - obj: { id: seg_5, width: 56px, height: 36px, radius: 4px, x: 320px, bg_color: 0x4E9FD4, bg_opa: COVER, border_width: 0, clickable: true, on_click: { script.execute: { id: set_brightness_to, value: 60 } } }
                  - obj: { id: seg_6, width: 56px, height: 36px, radius: 4px, x: 384px, bg_color: 0x4E9FD4, bg_opa: COVER, border_width: 0, clickable: true, on_click: { script.execute: { id: set_brightness_to, value: 70 } } }
                  - obj: { id: seg_7, width: 56px, height: 36px, radius: 4px, x: 448px, bg_color: 0x1A3050, bg_opa: COVER, border_width: 0, clickable: true, on_click: { script.execute: { id: set_brightness_to, value: 80 } } }
                  - obj: { id: seg_8, width: 56px, height: 36px, radius: 4px, x: 512px, bg_color: 0x1A3050, bg_opa: COVER, border_width: 0, clickable: true, on_click: { script.execute: { id: set_brightness_to, value: 90 } } }
                  - obj: { id: seg_9, width: 56px, height: 36px, radius: 4px, x: 576px, bg_color: 0x1A3050, bg_opa: COVER, border_width: 0, clickable: true, on_click: { script.execute: { id: set_brightness_to, value: 100 } } }
            - label:
                id: lbl_brightness_value
                text: "70%"
                text_font: font_body
                text_color: 0x4E9FD4
                align: RIGHT_MID
                x: -20px
                width: 84px

      # ---- Row 2: Theme --------------------------------------
      - obj:
          id: set_theme
          x: 0px
          y: 60px
          width: 1152px
          height: 56px
          radius: 8px
          bg_color: 0x0A182B
          bg_opa: COVER
          border_width: 0
          pad_all: 0
          scrollable: false
          clickable: true
          on_click:
            - script.execute: theme_cycle
          widgets:
            - label: { id: lbl_theme_title, text: "Theme Mode", text_font: font_body, text_color: 0xDCE8F5, align: LEFT_MID, x: 20px, width: 340px }
            - label: { id: lbl_theme, text: "Follow the sun", text_font: font_body, text_color: 0x4E9FD4, align: RIGHT_MID, x: -20px, width: 420px }

      # ---- Row 3: Idle Behavior ------------------------------
      - obj:
          id: set_idle
          x: 0px
          y: 120px
          width: 1152px
          height: 56px
          radius: 8px
          bg_color: 0x0A182B
          bg_opa: COVER
          border_width: 0
          pad_all: 0
          scrollable: false
          clickable: true
          on_click:
            - script.execute: idle_cycle
          widgets:
            - label: { id: lbl_idle_title, text: "When Idle", text_font: font_body, text_color: 0xDCE8F5, align: LEFT_MID, x: 20px, width: 340px }
            - label: { id: lbl_idle, text: "Dim, after 15 minutes", text_font: font_body, text_color: 0x4E9FD4, align: RIGHT_MID, x: -20px, width: 420px }

      # ---- Row 4: Orientation --------------------------------
      - obj:
          id: set_orientation
          x: 0px
          y: 180px
          width: 1152px
          height: 56px
          radius: 8px
          bg_color: 0x0A182B
          bg_opa: COVER
          border_width: 0
          pad_all: 0
          scrollable: false
          clickable: true
          on_click:
            - script.execute: orientation_cycle
          widgets:
            - label: { id: lbl_orientation_title, text: "Orientation", text_font: font_body, text_color: 0xDCE8F5, align: LEFT_MID, x: 20px, width: 340px }
            - label: { id: lbl_orientation, text: "Landscape", text_font: font_body, text_color: 0x4E9FD4, align: RIGHT_MID, x: -20px, width: 420px }

      # ---- Row 5: Skip Button Visibility ---------------------
      - obj:
          id: set_skip
          x: 0px
          y: 240px
          width: 1152px
          height: 56px
          radius: 8px
          bg_color: 0x0A182B
          bg_opa: COVER
          border_width: 0
          pad_all: 0
          scrollable: false
          clickable: true
          on_click:
            - script.execute: skip_toggle
          widgets:
            - label: { id: lbl_skip_title, text: "Track Skip Button", text_font: font_body, text_color: 0xDCE8F5, align: LEFT_MID, x: 20px, width: 340px }
            - label: { id: lbl_skip, text: "Allowed", text_font: font_body, text_color: 0x4E9FD4, align: RIGHT_MID, x: -20px, width: 420px }

      # ---- Row 6: Open Wi-Fi & Bind Setup --------------------
      - obj:
          id: set_setup
          x: 0px
          y: 300px
          width: 1152px
          height: 56px
          radius: 8px
          bg_color: 0x0D223A
          bg_opa: COVER
          border_width: 1
          border_color: 0x29527A
          border_opa: COVER
          pad_all: 0
          scrollable: false
          clickable: true
          on_click:
            - script.execute: { id: window_go, target: 3 }
          widgets:
            - label: { id: lbl_setup_title, text: "Wi-Fi & Station Setup", text_font: font_body, text_color: 0xDCE8F5, align: LEFT_MID, x: 20px, width: 360px }
            - label: { id: lbl_setup, text: "Configure Network or Bind →", text_font: font_body, text_color: 0x4E9FD4, align: RIGHT_MID, x: -20px, width: 460px }

      # ---- Divider Rule --------------------------------------
      - obj:
          id: settings_rule
          x: 0px
          y: 372px
          width: 1152px
          height: 1px
          bg_color: 0x1A3050
          bg_opa: COVER
          border_width: 0

      # ---- Read-Only Device Telemetry ------------------------
      - label: { id: lbl_wifi,   text: "Wi-Fi Network", text_font: font_small, text_color: 0x6A8BA8, align: TOP_LEFT,  x: 20px,  y: 390px, width: 300px }
      - label: { id: val_wifi,   text: "Not connected", text_font: font_small, text_color: 0xDCE8F5, align: TOP_RIGHT, x: -20px, y: 390px, width: 700px }
      - label: { id: lbl_addr,   text: "IP Address",    text_font: font_small, text_color: 0x6A8BA8, align: TOP_LEFT,  x: 20px,  y: 428px, width: 300px }
      - label: { id: val_addr,   text: "—",             text_font: font_small, text_color: 0xDCE8F5, align: TOP_RIGHT, x: -20px, y: 428px, width: 700px }
      - label: { id: lbl_model,  text: "Hardware",      text_font: font_small, text_color: 0x6A8BA8, align: TOP_LEFT,  x: 20px,  y: 466px, width: 300px }
      - label: { id: val_model,  text: "JC8012P4A1",    text_font: font_small, text_color: 0xDCE8F5, align: TOP_RIGHT, x: -20px, y: 466px, width: 700px }
      - label: { id: lbl_ver,    text: "Firmware",      text_font: font_small, text_color: 0x6A8BA8, align: TOP_LEFT,  x: 20px,  y: 504px, width: 300px }
      - label: { id: val_ver,    text: "1.11.0",        text_font: font_small, text_color: 0xDCE8F5, align: TOP_RIGHT, x: -20px, y: 504px, width: 700px }
      - label: { id: lbl_up,     text: "Uptime",        text_font: font_small, text_color: 0x6A8BA8, align: TOP_LEFT,  x: 20px,  y: 542px, width: 300px }
      - label: { id: val_up,     text: "0 minutes",     text_font: font_small, text_color: 0xDCE8F5, align: TOP_RIGHT, x: -20px, y: 542px, width: 700px }
