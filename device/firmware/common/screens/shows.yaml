# The expansion tray. One row open at a time — the same single-key
# accordion the web uses, so "only one" is a rule rather than a
# preference.
- obj:
    id: shows_expanded
    width: 1152px
    height: 200px
    align: BOTTOM_LEFT
    x: 64px
    y: -88px
    bg_color: 0x0D1F35
    bg_opa: COVER
