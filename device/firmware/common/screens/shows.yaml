# Window 2 of 3 — the show list.
#
# A DIFFERENT REGISTER, not the same template with a list swapped in. No art, no
# serif: this is the data screen. Everything is Archivo at tabular widths with
# hairline separators, because rotation between this and the now-playing window
# should feel like a change of instrument.
#
# "NOW AND NEXT" ONLY — NO DAY NAVIGATION. That is a deliberate reduction. A wall
# display answers "what is on"; it does not need a browsable week. The full
# interactive schedule stays one tap away in the browser, and the firmware never
# implements day-run merging or timezone navigation at all: the server sends six
# slots already resolved and already formatted in station time, so there is only
# ever one implementation of those rules.
#
# AVATARS ONLY ON THE EXPANDED ROW, exactly as SchedulePanel.tsx does it — one row
# open at a time, collapsed by default. A list whose every row carries a face is
# harder to scan, not easier, and on a wall the scan is the whole job.

# The CONTENT of window shows — the widgets only.
#
# The slot that holds these (id, size, and the fact that it slides inside
# window_stack) is declared in ../window.yaml, because the sliding mechanism
# belongs to neither this screen nor the others. Since ESPHome dropped the
# `parent:` key, a widget's parent is simply the `widgets:` list it sits in,
# and a list can only come from the file that encloses it.
#
# Anything this screen used to declare BESIDE its widgets — scripts, globals —
# is now in ./scripts.yaml, because a bare list cannot have siblings.

- obj:
    id: live_lamp_shows
    width: 12px
    height: 12px
    radius: 6px
    align: TOP_LEFT
    x: 64px
    y: 48px
    bg_color: 0x4E9FD4
    bg_opa: COVER

- label:
    id: shows_station
    text: "SUB/WAVE"
    text_font: font_body
    text_color: 0xDCE8F5
    align: TOP_LEFT
    x: 88px
    y: 44px
    width: 520px

- label:
    id: shows_day
    text: ""
    text_font: font_body
    text_color: 0x6A8BA8
    align: TOP_RIGHT
    x: -64px
    y: 44px
    width: 300px

# Fixed columns. A wall list read at an angle needs a stable vertical
# edge to scan, and that means the times must not shift with the show
# name beside them.
- obj:
    id: shows_list
    width: 1152px
    height: 560px
    align: TOP_LEFT
    x: 64px
    y: 128px
    scrollable: true
    scrollbar_mode: LV_SCROLLBAR_MODE_AUTO
    widgets:
      - obj:
          id: row_0
          width: 100%
          height: 96px
          widgets:
            - label:
                id: row_0_time
                text: ""
                text_font: font_body
                text_color: 0x6A8BA8
                align: LEFT_MID
                x: 16px
                y: 16px
                width: 190px
            - label:
                id: row_0_name
                text: ""
                text_font: font_body
                text_color: 0xDCE8F5
                align: LEFT_MID
                x: 216px
                y: 16px
                width: 560px
            - label:
                id: row_0_host
                text: ""
                text_font: font_small
                text_color: 0x6A8BA8
                align: LEFT_MID
                x: 216px
                y: 48px
                width: 560px
            - image:
                id: row_0_avatar
                src: row_0_avatar_image
                width: 56px
                height: 56px
                align: RIGHT_MID
                x: -16px
            - obj:
                id: row_0_rule
                width: 100%
                height: 1px
                align: BOTTOM_MID
                bg_color: 0x1A3050
                bg_opa: COVER

      - obj:
          id: row_1
          width: 100%
          height: 96px
          widgets:
            - label: { id: row_1_time, text: "", text_font: font_body, text_color: 0x6A8BA8, align: LEFT_MID, x: 16px, y: 16px, width: 190px }
            - label: { id: row_1_name, text: "", text_font: font_body, text_color: 0xDCE8F5, align: LEFT_MID, x: 216px, y: 16px, width: 560px }
            - label: { id: row_1_host, text: "", text_font: font_small, text_color: 0x6A8BA8, align: LEFT_MID, x: 216px, y: 48px, width: 560px }
            - image: { id: row_1_avatar, src: row_1_avatar_image, width: 56px, height: 56px, align: RIGHT_MID, x: -16px }
            - obj:   { id: row_1_rule, width: "100%", height: 1px, align: BOTTOM_MID, bg_color: 0x1A3050, bg_opa: COVER }

      - obj:
