<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="100%" height="100%">
  <defs>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>
    <linearGradient id="fmGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <g filter="url(#glow)">
    <!-- Stylized 'C' Wave -->
    <path d="M 50 65 C 20 65, 5 45, 5 25 C 5 10, 25 5, 40 12 C 32 15, 20 20, 20 35 C 20 50, 30 55, 45 55 C 52 55, 60 50, 68 42 C 72 48, 60 65, 50 65 Z" fill="url(#waveGrad)" />
    <!-- Wave crest detail -->
    <path d="M 12 40 C 25 20, 45 25, 52 38 C 40 28, 25 28, 12 40 Z" fill="#ffffff" opacity="0.9" />

    <!-- Text: auseway -->
    <text x="75" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="52" fill="url(#textGrad)" letter-spacing="-1">auseway</text>
    
    <!-- Text: FM -->
    <text x="300" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="52" fill="url(#fmGrad)" letter-spacing="1">FM</text>
  </g>
</svg>
